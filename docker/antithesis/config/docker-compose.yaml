#
# The hashi Antithesis environment. Shipped at the root of the config image next
# to `.env` (image tags) and `genesis/files` (generated by genesis/generate.py);
# relative paths resolve against that root. See ../README.md.

x-sui-node: &sui-node
  image: ${SUI_NODE_IMAGE}
  environment:
    - RUST_BACKTRACE=1
    - RUST_LOG=${SUI_RUST_LOG:-info}
    - SUI_DB_SYNC_TO_DISK=true
    - TOKIO_WORKER_THREADS=4
  restart: on-failure

x-hashi-node: &hashi-node
  image: hashi-node:${HASHI_NODE_TAG}
  environment:
    - RUST_BACKTRACE=1
    - RUST_LOG=${HASHI_RUST_LOG:-info}
  # hashi nodes cannot be configured until the bootstrap has published the
  # package, so each waits for the config the bootstrap writes for it.
  entrypoint: ["/bin/sh", "-c"]
  restart: on-failure

x-tools: &tools
  image: hashi-antithesis:${HASHI_ANTITHESIS_TAG}
  environment:
    - RUST_BACKTRACE=1
    - RUST_LOG=${TOOLS_RUST_LOG:-info}
    # Unset under Antithesis; run-local.sh points it into ./sdk.
    - ANTITHESIS_SDK_LOCAL_OUTPUT
  restart: on-failure

services:
  validator1:
    <<: *sui-node
    container_name: validator1
    hostname: validator1
    networks:
      hashi-network:
        ipv4_address: 10.0.0.11
    volumes:
      - ./genesis/files/validator1-8080.yaml:/opt/sui/config/validator.yaml:ro
      - ./genesis/files/genesis.blob:/opt/sui/config/genesis.blob:ro
      - ./data/validator1:/opt/sui/db:rw
    command: ["/opt/sui/bin/sui-node", "--config-path", "/opt/sui/config/validator.yaml"]

  validator2:
    <<: *sui-node
    container_name: validator2
    hostname: validator2
    networks:
      hashi-network:
        ipv4_address: 10.0.0.12
    volumes:
      - ./genesis/files/validator2-8080.yaml:/opt/sui/config/validator.yaml:ro
      - ./genesis/files/genesis.blob:/opt/sui/config/genesis.blob:ro
      - ./data/validator2:/opt/sui/db:rw
    command: ["/opt/sui/bin/sui-node", "--config-path", "/opt/sui/config/validator.yaml"]

  validator3:
    <<: *sui-node
    container_name: validator3
    hostname: validator3
    networks:
      hashi-network:
        ipv4_address: 10.0.0.13
    volumes:
      - ./genesis/files/validator3-8080.yaml:/opt/sui/config/validator.yaml:ro
      - ./genesis/files/genesis.blob:/opt/sui/config/genesis.blob:ro
      - ./data/validator3:/opt/sui/db:rw
    command: ["/opt/sui/bin/sui-node", "--config-path", "/opt/sui/config/validator.yaml"]

  validator4:
    <<: *sui-node
    container_name: validator4
    hostname: validator4
    networks:
      hashi-network:
        ipv4_address: 10.0.0.14
    volumes:
      - ./genesis/files/validator4-8080.yaml:/opt/sui/config/validator.yaml:ro
      - ./genesis/files/genesis.blob:/opt/sui/config/genesis.blob:ro
      - ./data/validator4:/opt/sui/db:rw
    command: ["/opt/sui/bin/sui-node", "--config-path", "/opt/sui/config/validator.yaml"]

  fullnode:
    <<: *sui-node
    container_name: fullnode
    hostname: fullnode
    networks:
      hashi-network:
        ipv4_address: 10.0.0.15
    volumes:
      - ./genesis/files/fullnode.yaml:/opt/sui/config/fullnode.yaml:ro
      - ./genesis/files/genesis.blob:/opt/sui/config/genesis.blob:ro
      - ./data/fullnode:/opt/sui/db:rw
    command: ["/opt/sui/bin/sui-node", "--config-path", "/opt/sui/config/fullnode.yaml"]

  bitcoind:
    <<: *tools
    container_name: bitcoind
    hostname: bitcoind
    networks:
      hashi-network:
        ipv4_address: 10.0.0.20
    volumes:
      - ./data/bitcoind:/data:rw
    # Flags follow e2e-tests' BitcoinNodeHandle, but listening on the docker
    # network. The subnet is noban-whitelisted: every hashi node's Kyoto client
    # syncs from this one peer and reconnects after faults, and a ban would cut
    # it off from the only source of blocks.
    command:
      - bitcoind
      - -regtest
      - -server
      - -datadir=/data
      - -printtoconsole
      - -rpcuser=test
      - -rpcpassword=test
      - -rpcbind=0.0.0.0
      - -rpcallowip=10.0.0.0/24
      - -bind=0.0.0.0:18444
      - -listen=1
      - -listenonion=0
      - -whitelist=noban@10.0.0.0/24
      - -fallbackfee=0.0001
      - -acceptnonstdtxn=1
      - -blockfilterindex=1
      - -peerblockfilters=1
      - -txindex=1

  guardian:
    <<: *tools
    container_name: guardian
    hostname: guardian
    networks:
      hashi-network:
        ipv4_address: 10.0.0.21
    volumes:
      - ./genesis/files/hashi-env.yaml:/genesis/hashi-env.yaml:ro
      - ./shared:/shared:ro
      - ./sdk:/sdk:rw
    command: ["hashi-antithesis", "guardian"]

  bootstrap:
    <<: *tools
    container_name: bootstrap
    hostname: bootstrap
    networks:
      hashi-network:
        ipv4_address: 10.0.0.22
    volumes:
      - ./genesis/files/hashi-env.yaml:/genesis/hashi-env.yaml:ro
      - ./shared:/shared:rw
      - ./sdk:/sdk:rw
    command: ["hashi-antithesis", "bootstrap"]
    # One-shot; it exits 0 once setup_complete has been signaled.
    restart: "no"

  hashi1:
    <<: *hashi-node
    container_name: hashi1
    hostname: hashi1
    networks:
      hashi-network:
        ipv4_address: 10.0.0.31
    volumes:
      - ./shared:/shared:ro
      - ./data/hashi1:/opt/hashi/data:rw
    command: ["until [ -f /shared/hashi1.toml ]; do sleep 1; done; exec /opt/hashi/bin/hashi server --config /shared/hashi1.toml"]

  hashi2:
    <<: *hashi-node
    container_name: hashi2
    hostname: hashi2
    networks:
      hashi-network:
        ipv4_address: 10.0.0.32
    volumes:
      - ./shared:/shared:ro
      - ./data/hashi2:/opt/hashi/data:rw
    command: ["until [ -f /shared/hashi2.toml ]; do sleep 1; done; exec /opt/hashi/bin/hashi server --config /shared/hashi2.toml"]

  hashi3:
    <<: *hashi-node
    container_name: hashi3
    hostname: hashi3
    networks:
      hashi-network:
        ipv4_address: 10.0.0.33
    volumes:
      - ./shared:/shared:ro
      - ./data/hashi3:/opt/hashi/data:rw
    command: ["until [ -f /shared/hashi3.toml ]; do sleep 1; done; exec /opt/hashi/bin/hashi server --config /shared/hashi3.toml"]

  hashi4:
    <<: *hashi-node
    container_name: hashi4
    hostname: hashi4
    networks:
      hashi-network:
        ipv4_address: 10.0.0.34
    volumes:
      - ./shared:/shared:ro
      - ./data/hashi4:/opt/hashi/data:rw
    command: ["until [ -f /shared/hashi4.toml ]; do sleep 1; done; exec /opt/hashi/bin/hashi server --config /shared/hashi4.toml"]

  workload:
    <<: *tools
    container_name: workload
    hostname: workload
    networks:
      hashi-network:
        ipv4_address: 10.0.0.40
    volumes:
      - ./genesis/files/hashi-env.yaml:/genesis/hashi-env.yaml:ro
      - ./shared:/shared:ro
      - ./sdk:/sdk:rw
      - ./data/workload:/state:rw
    command: ["hashi-antithesis", "workload"]

networks:
  hashi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
