# Nextest configuration for hashi
# See https://nexte.st/docs/configuration/ for details

[test-groups]
e2e = { max-threads = 4 }

# Integration tests in e2e-tests are heavy - they spin up Bitcoin regtest,
# Sui localnet, and multiple Hashi nodes. Cap their concurrency independently
# of the runner's CPU count.
[[profile.default.overrides]]
filter = 'package(e2e-tests)'
test-group = 'e2e'

# The resignation-lifecycle e2e forces two epoch boundaries with resharing
# across four nodes; under a packed scheduler it starves (timers stop firing)
# and times out despite passing in isolation. Reserve the full global test
# thread pool so this test runs exclusively on every runner size.
[[profile.default.overrides]]
filter = 'test(test_resigned_member_excluded_then_removed_permissionlessly)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(hashi-monitor)'
threads-required = 4

# CI profile with more conservative settings
[profile.ci]
# Retry flaky tests once in CI
retries = 1
failure-output = "immediate-final"
success-output = "never"
# Don't stop on first failure - run all tests
fail-fast = false
# Kill a test that has been slow for 12 minutes and let `retries` re-run it.
# Without this, a heavy e2e test that stalls (e.g. a synchronous DB write
# blocking the single-thread runtime under CI I/O contention) runs until the
# 6h GitHub job cap instead of failing and retrying. Legitimate e2e tests
# finish well under 12 minutes, so this only fires on a genuine hang.
slow-timeout = { period = "60s", terminate-after = 12 }
