        "proposal::proposal_mutual_exclusion::create_does_not_duplicate_proposal",
        "proposal::proposal_state_machine::create_enters_active",
        "proposal::proposal_state_machine::vote_preserves_membership",
        "proposal::proposal_state_machine::remove_vote_preserves_membership",
        "proposal::proposal_state_machine::execute_moves_active_to_executed",
        "proposal::proposal_state_machine::delete_expired_exits_both_bags",
        "proposal::proposal_state_machine::execute_requires_quorum",
        "proposal::reconfig_abort::abort_preserves_current_epoch_and_committee",
        "proposal::reconfig_abort::start_never_targets_current_committee",
        "proposal::reconfig_abort::abort_reconfig_requires_matching_epoch",
        "proposal::reconfig_abort::abort_never_in_start_epoch",
        "proposal::reconfig_abort::end_reconfig_requires_current_sui_epoch",
        "proposal::reconfig_epoch::start_then_end_sets_sui_epoch",
        "proposal::reconfig_epoch::epoch_only_changes_at_end_reconfig",
        "proposal::reconfig_epoch::start_then_end_advances_epoch",
