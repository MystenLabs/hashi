{
    "override_base_config": "confs/spec.conf",
    "spec_package_path": "specs/proposal",
    "msg": "Hashi Proposal spec",
    "rule": [
        "proposal::proposals_integrity::pause_proposal_threshold_matches_config",
        "proposal::proposals_integrity::unpause_requires_pinned_threshold",
        "proposal::proposals_integrity::propose_then_execute_unpause_meets_unpause_bar",
        "proposal::proposals_integrity::update_config_proposal_threshold_is_supermajority",
        "proposal::proposals_integrity::update_config_preserves_guardian_btc_public_key",
        "proposal::proposals_integrity::upgrade_proposal_threshold_is_supermajority",
        "proposal::proposals_integrity::delete_expired_requires_not_executed",
        "proposal::proposals_integrity::delete_expired_requires_expiry",
        "proposal::proposals_integrity::vote_records_validator",
        "proposal::proposals_integrity::remove_vote_removes_validator",
        "proposal::proposals_integrity2::expiry_deadline_is_immutable",
        "proposal::proposals_integrity2::threshold_bps_is_immutable",
        "proposal::proposals_integrity2::executed_proposal_is_frozen",
        "proposal::proposals_integrity2::executed_flag_matches_bag",
        "proposal::proposals_integrity2::create_establishes_executed_flag",
        "proposal::proposal_expiry::no_action_after_expiry",
