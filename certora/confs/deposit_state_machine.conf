{
    "override_base_config": "confs/spec.conf",
    "spec_package_path": "specs/deposit",
    "msg": "Hashi DEPOSIT-STATE-MACHINE",
    "rule": [
        "deposit::deposit_field_consistency::approval_fields_paired",
        "deposit::deposit_field_consistency::approval_fields_never_reset",
        "deposit::deposit_field_consistency::confirmed_implies_approved",
        "deposit::deposit_field_consistency::deposit_creates_unapproved_unconfirmed_request",
        "deposit::deposit_field_consistency::approve_deposit_sets_approval_fields",
        "deposit::deposit_field_consistency::confirm_deposit_sets_confirmed_field",
        "deposit::deposit_integrity::confirm_requires_prior_approval",
        "deposit::deposit_integrity::confirm_deposit_at_most_once",
        "deposit::deposit_integrity::no_same_epoch_reapproval",
        "deposit::deposit_integrity::insert_active_rejects_duplicate",
        "deposit::deposit_integrity::insert_pending_rejects_spent"
    ]
}
