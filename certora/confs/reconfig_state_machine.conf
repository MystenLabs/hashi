{
    "override_base_config": "confs/spec.conf",
    "spec_package_path": "specs/proposal",
    "msg": "Hashi RECONFIG-STATE-MACHINE",
    "rule": [
        "proposal::reconfig_state_machine::start_enters_reconfiguring",
        "proposal::reconfig_state_machine::submit_records_handoff",
        "proposal::reconfig_state_machine::end_completes_reconfig",
        "proposal::reconfig_state_machine::abort_cancels_reconfig",
        "proposal::reconfig_state_machine::start_requires_idle",
        "proposal::reconfig_state_machine::submit_requires_busy",
        "proposal::reconfig_state_machine::end_requires_busy",
        "proposal::reconfig_state_machine::abort_requires_busy",
        "proposal::reconfig_state_machine::cannot_start_two_reconfigs",
        "proposal::reconfig_state_machine::pending_epoch_fixed_while_reconfiguring"
    ]
}
