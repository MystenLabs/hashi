[package]
name = "hashi-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
axum.workspace = true
bitcoin.workspace = true
clap.workspace = true
futures.workspace = true
hashi-types = { path = "../hashi-types" }
# The guardian's S3 log reader, its S3 credential resolution and its log
# clock-skew bound.
hashi-guardian = { path = "../hashi-guardian" }
hex.workspace = true
minreq = { workspace = true, features = ["json-using-serde"] }
# 0.13 adds a third rand and getrandom, and 0.14 a second reqwest.
object_store = { version = "0.12.5", default-features = false, features = ["gcp"] }
prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sui-rpc.workspace = true
sui-sdk-types.workspace = true
time = { version = "0.3", features = ["parsing"] }
tokio.workspace = true
tonic.workspace = true
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
base64ct.workspace = true
e2e-tests = { path = "../e2e-tests" }
hashi-guardian = { path = "../hashi-guardian", features = ["test-utils"] }
tempfile.workspace = true
tracing-subscriber.workspace = true
