[package]
name = "hashi-guardian-proxy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tonic.workspace = true
tonic-health.workspace = true
hashi-types = { path = "../hashi-types" }
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-acm.workspace = true
axum.workspace = true
bitcoin.workspace = true
prometheus.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["cors"] }
hex.workspace = true
base64ct.workspace = true
bytes.workspace = true
prost.workspace = true
reqwest.workspace = true
snap.workspace = true
sui-http.workspace = true
rustls.workspace = true
pkcs8.workspace = true
x509-parser.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
sui-rpc.workspace = true
sui-sdk-types.workspace = true

[features]
# Dev deploys: admit the KP attestations a non-enclave-dev guardian accepts.
non-enclave-dev = ["hashi-types/non-enclave-dev"]

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
hashi-types = { path = "../hashi-types", features = ["test-utils"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream.workspace = true
