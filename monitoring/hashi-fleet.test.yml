  # hashi-a and hashi-b stop heartbeating at 30m.
  - name: half-the-fleet-has-a-stalled-task
    interval: 5m
    input_series:
      - series: 'hashi_task_last_iteration_timestamp_seconds{host="hashi-a",task="leader_loop"}'
        values: '0+300x6 1800x34'
      - series: 'hashi_task_last_iteration_timestamp_seconds{host="hashi-b",task="leader_loop"}'
        values: '0+300x6 1800x34'
      - series: 'hashi_task_last_iteration_timestamp_seconds{host="hashi-c",task="leader_loop"}'
        values: '0+300x40'
      - series: 'hashi_task_last_iteration_timestamp_seconds{host="hashi-d",task="leader_loop"}'
        values: '0+300x40'
    alert_rule_test:
      - eval_time: 70m
        alertname: HashiFleetTasksStalled
        exp_alerts: []
      - eval_time: 80m
        alertname: HashiFleetTasksStalled
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "more than 25% of hashi validators have a task loop that stopped iterating"
              description: &hashiFleetTasksStalled >-
                A quarter of the committee has a leader, MPC or watcher loop that has
                not completed an iteration in 30 minutes while still reporting
                metrics. A fleet-wide stall points at a shared dependency: the
                fullnode checkpoint stream, the guardian, or a release bug.

  - name: one-in-four-has-a-stalled-task
    interval: 5m
    input_series:
      - series: 'hashi_task_last_iteration_timestamp_seconds{host="hashi-a",task="leader_loop"}'
        values: '0+300x6 1800x34'
      - series: 'hashi_task_last_iteration_timestamp_seconds{host="hashi-b",task="leader_loop"}'
        values: '0+300x40'
      - series: 'hashi_task_last_iteration_timestamp_seconds{host="hashi-c",task="leader_loop"}'
        values: '0+300x40'
      - series: 'hashi_task_last_iteration_timestamp_seconds{host="hashi-d",task="leader_loop"}'
        values: '0+300x40'
    alert_rule_test:
      - eval_time: 80m
        alertname: HashiFleetTasksStalled
        exp_alerts: []

  # hashi-a and hashi-b stop applying checkpoints at 30m.
  - name: half-the-fleet-behind-on-checkpoints
    interval: 5m
    input_series:
      - series: 'hashi_latest_checkpoint_timestamp_ms{host="hashi-a"}'
        values: '0+300000x6 1800000x34'
      - series: 'hashi_latest_checkpoint_timestamp_ms{host="hashi-b"}'
        values: '0+300000x6 1800000x34'
      - series: 'hashi_latest_checkpoint_timestamp_ms{host="hashi-c"}'
        values: '0+300000x40'
      - series: 'hashi_latest_checkpoint_timestamp_ms{host="hashi-d"}'
        values: '0+300000x40'
    alert_rule_test:
      - eval_time: 50m
        alertname: HashiFleetCheckpointLag
        exp_alerts: []
      - eval_time: 60m
        alertname: HashiFleetCheckpointLag
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "more than 25% of hashi validators are over 10 minutes behind the Sui checkpoint stream"
              description: &hashiFleetCheckpointLag >-
                A quarter of the committee is acting on on-chain state more than 10
                minutes old. Votes from those nodes lag the current queues and
                limiter. If it coincides with a Sui network incident it will clear on
                its own; otherwise suspect the fullnodes operators subscribe to.

  # hashi-b is booting and reads 0; only hashi-a of the other four is behind.
  - name: booting-validators-are-not-behind
    interval: 5m
    input_series:
      - series: 'hashi_latest_checkpoint_timestamp_ms{host="hashi-a"}'
        values: '0+300000x6 1800000x34'
      - series: 'hashi_latest_checkpoint_timestamp_ms{host="hashi-b"}'
        values: '0x40'
      - series: 'hashi_latest_checkpoint_timestamp_ms{host="hashi-c"}'
        values: '0+300000x40'
      - series: 'hashi_latest_checkpoint_timestamp_ms{host="hashi-d"}'
        values: '0+300000x40'
      - series: 'hashi_latest_checkpoint_timestamp_ms{host="hashi-e"}'
        values: '0+300000x40'
    alert_rule_test:
      - eval_time: 60m
        alertname: HashiFleetCheckpointLag
        exp_alerts: []

  - name: pool-exhausted-for-over-an-hour
    interval: 1m
    input_series:
      - series: 'hashi_mpc_sign_failures_total{host="hashi-a",reason="pool_exhausted"}'
        values: '0+5x100'
    alert_rule_test:
      - eval_time: 55m
        alertname: HashiFleetPresigExhausted
        exp_alerts: []
      - eval_time: 70m
        alertname: HashiFleetPresigExhausted
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "hashi validators are failing to sign for lack of presignatures"
              description: &hashiFleetPresigExhausted >-
                Signing has been failing with `pool_exhausted` across the fleet for an
                hour. Withdrawals stall until the nonce pipeline refills. This peaked
                at hundreds per second on 2026-08-04; check the AVID nonce counters
                (`hashi_mpc_nonce_*`) before anything else.

  # A 30-minute burst.
  - name: pool-exhausted-burst-refills
    interval: 1m
    input_series:
      - series: 'hashi_mpc_sign_failures_total{host="hashi-a",reason="pool_exhausted"}'
        values: '0+5x30 150x70'
    alert_rule_test:
      - eval_time: 45m
        alertname: HashiFleetPresigExhausted
        exp_alerts: []
      - eval_time: 70m
        alertname: HashiFleetPresigExhausted
        exp_alerts: []

  - name: a-fifth-of-signing-attempts-time-out
    interval: 1m
    input_series:
      - series: 'hashi_mpc_sign_failures_total{host="hashi-a",reason="timeout"}'
        values: '0+2x90'
      - series: 'hashi_mpc_sign_duration_seconds_count{host="hashi-a",outcome="success"}'
        values: '0+10x90'
    alert_rule_test:
      - eval_time: 40m
        alertname: HashiFleetSigningTimeouts
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "more than 10% of MPC signing attempts across the fleet are timing out"
              description: &hashiFleetSigningTimeouts >-
                Over a tenth of partial-signature attempts across the committee have
                been timing out for 30 minutes, several times the normal rate. Either
                a large share of the committee is unreachable to its peers or a
                release slowed signing down. Compare with the fleet-shrunk and
                reconfig alerts.

  - name: one-in-twenty-signing-attempts-time-out
    interval: 1m
    input_series:
