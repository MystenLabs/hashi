      - eval_time: 35m
        alertname: HashiFleetKeyStateInconsistent
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "some hashi validators found no local key for their on-chain registration"
              description: &hashiFleetKeyStateInconsistent >-
                At least one validator either has no local key matching its on-chain
                registration or recovered a key that contradicts the chain. Those
                nodes cannot contribute signatures. Either counter's increase by
                `host` names them.

