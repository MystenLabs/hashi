      - series: 'hashi_guardian_enabled{host="hashi-b"}'
        values: '1x12'
      - series: 'hashi_guardian_enabled{host="hashi-c"}'
        values: '1x12'
      - series: 'hashi_guardian_enabled{host="hashi-d"}'
        values: '1x12'
    alert_rule_test:
