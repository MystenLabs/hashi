        values: '0x12'
      - series: 'hashi_guardian_enabled{host="hashi-b"}'
        values: '0x12'
      - series: 'hashi_guardian_enabled{host="hashi-c"}'
        values: '0x12'
      - series: 'hashi_guardian_enabled{host="hashi-d"}'
        values: '1x12'
      - series: 'hashi_onchain_scrape_in_progress{host="hashi-a"}'
        values: '1x12'
      - series: 'hashi_onchain_scrape_in_progress{host="hashi-b"}'
        values: '1x12'
      - series: 'hashi_onchain_scrape_in_progress{host="hashi-c"}'
        values: '1x12'
      - series: 'hashi_onchain_scrape_in_progress{host="hashi-d"}'
