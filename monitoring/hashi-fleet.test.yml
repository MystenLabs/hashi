      - series: 'hashi_guardian_limiter_max_capacity{host="hashi-b"}'
        values: '1000x20'
    alert_rule_test:
      - eval_time: 50m
        alertname: HashiFleetLimiterDrained
        exp_alerts: []
      - eval_time: 70m
        alertname: HashiFleetLimiterDrained
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "the guardian's withdrawal rate limiter has been under 5% of capacity for an hour"
              description: &hashiFleetLimiterDrained >-
                Withdrawals are being throttled by the guardian's token bucket. Either
                demand is genuinely above the configured rate, or a stuck oversize
                request is holding the queue. Raising the policy needs a guardian
                re-provision behind a KP quorum, so decide early.

  - name: one-validator-still-has-tokens
    interval: 5m
    input_series:
      - series: 'hashi_guardian_limiter_tokens_available{host="hashi-a"}'
        values: '500x20'
      - series: 'hashi_guardian_limiter_tokens_available{host="hashi-b"}'
