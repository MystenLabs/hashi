      - eval_time: 35m
        alertname: HashiFleetOversizeWithdrawal
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "an approved withdrawal exceeds the guardian limiter's maximum capacity"
              description: &hashiFleetOversizeWithdrawal >-
                The leader skipped an approved withdrawal because its amount exceeds
                the limiter's `max_bucket_capacity`. The request stays approved on
                chain and will never be processed: raise the cap, or have the user
                cancel and resubmit smaller withdrawals.

  - name: most-validators-lose-the-guardian-endpoint
    interval: 5m
    input_series:
      - series: 'hashi_guardian_enabled{host="hashi-a"}'
        values: '0x12'
      - series: 'hashi_guardian_enabled{host="hashi-b"}'
        values: '0x12'
      - series: 'hashi_guardian_enabled{host="hashi-c"}'
        values: '0x12'
