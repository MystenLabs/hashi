  - name: a-reconfiguration-is-aborted
    interval: 1m
    input_series:
      - series: 'hashi_reconfig_aborted_total{host="hashi-a"}'
        values: '0x30 1x30'
      - series: 'hashi_reconfig_aborted_total{host="hashi-b"}'
        values: '0x30 1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: HashiFleetReconfigAborted
        exp_alerts: []
      - eval_time: 35m
        alertname: HashiFleetReconfigAborted
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "a hashi reconfiguration was aborted"
              description: &hashiFleetReconfigAborted >-
                A reconfiguration overran its Sui epoch and was aborted; the
                replacement starts on its own. Find out why the first one stalled:
                offline stake, bad endpoints or keys, or a partition.
