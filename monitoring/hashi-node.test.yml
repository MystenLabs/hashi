rule_files:
  - hashi-node.rules.yml

evaluation_interval: 1m

tests:
  - name: peer-shed-in-its-first-sample-on-a-long-running-node
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '_x131 7830x120'
      - series: 'hashi_peer_requests_too_large_total{peer="A",instance="n1",job="hashi"}'
        values: '_x131 1x120'
    alert_rule_test:
      - eval_time: 135m
        alertname: HashiPeerShed
        exp_alerts:
          - exp_labels: {peer: A, instance: n1, job: hashi, limit: size, severity: warning}
            exp_annotations:
              summary: shed or refused traffic from peer A (size)
              description: &peer_shed >-
                The peer may be misbehaving, or this node may be slow or have its
                limits set too low. Rule this node out first (hashi_request_latency),
                then look the peer up with `hashi committee -c hashi-cli.toml view A`.
      - eval_time: 190m
        alertname: HashiPeerShed
        exp_alerts:
          - exp_labels: {peer: A, instance: n1, job: hashi, limit: size, severity: warning}
            exp_annotations:
              summary: shed or refused traffic from peer A (size)
              description: *peer_shed
      - eval_time: 200m
        alertname: HashiPeerShed
        exp_alerts: []

  - name: peer-series-created-at-zero-then-increases
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '60x240'
      - series: 'hashi_peer_mpc_work_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '0x119 1x120'
    alert_rule_test:
      - eval_time: 119m
        alertname: HashiPeerShed
        exp_alerts: []
      - eval_time: 125m
        alertname: HashiPeerShed
        exp_alerts:
          - exp_labels: {peer: A, instance: n1, job: hashi, limit: work, severity: warning}
            exp_annotations:
              summary: shed or refused traffic from peer A (work)
              description: *peer_shed
      - eval_time: 185m
        alertname: HashiPeerShed
        exp_alerts: []

  - name: restart-back-at-zero
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '60x119 stale _x4 7500x80'
      - series: 'hashi_peer_requests_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '5x119 stale _x4 0x80'
    alert_rule_test:
      - eval_time: 130m
        alertname: HashiPeerShed
        exp_alerts: []

  - name: restart-back-below-the-old-value
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '60x119 stale _x4 7500x80'
      - series: 'hashi_peer_requests_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '5x119 stale _x4 1x80'
    alert_rule_test:
      - eval_time: 130m
        alertname: HashiPeerShed
        exp_alerts:
          - exp_labels: {peer: A, instance: n1, job: hashi, limit: count, severity: warning}
            exp_annotations:
              summary: shed or refused traffic from peer A (count)
              description: *peer_shed

  - name: restart-back-at-the-old-value
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '60x119 stale _x4 7500x80'
      - series: 'hashi_peer_requests_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '5x119 stale _x4 5x80'
    alert_rule_test:
      - eval_time: 130m
        alertname: HashiPeerShed
        exp_alerts:
          - exp_labels: {peer: A, instance: n1, job: hashi, limit: count, severity: warning}
            exp_annotations:
              summary: shed or refused traffic from peer A (count)
              description: *peer_shed
      - eval_time: 190m
        alertname: HashiPeerShed
        exp_alerts: []

  - name: restart-from-zero-back-at-one
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '60x119 stale _x4 7500x80'
      - series: 'hashi_peer_requests_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '0x119 stale _x4 1x80'
    alert_rule_test:
      - eval_time: 130m
        alertname: HashiPeerShed
        exp_alerts:
          - exp_labels: {peer: A, instance: n1, job: hashi, limit: count, severity: warning}
            exp_annotations:
              summary: shed or refused traffic from peer A (count)
              description: *peer_shed

  - name: each-limit-gets-its-own-alert
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '_x130 7800x70'
      - series: 'hashi_peer_responses_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '_x130 1x70'
      - series: 'hashi_peer_requests_over_byte_budget_total{peer="A",budget="request",instance="n1",job="hashi"}'
        values: '_x130 1x70'
      - series: 'hashi_peer_requests_over_byte_budget_total{peer="A",budget="work",instance="n1",job="hashi"}'
        values: '_x130 1x70'
      - series: 'hashi_peer_requests_over_connection_limit_total{peer="A",instance="n1",job="hashi"}'
        values: '_x130 1x70'
    alert_rule_test:
      - eval_time: 150m
        alertname: HashiPeerShed
        exp_alerts:
          - exp_labels: {peer: A, instance: n1, job: hashi, limit: response, severity: warning}
            exp_annotations:
              summary: shed or refused traffic from peer A (response)
              description: *peer_shed
          - exp_labels: {peer: A, budget: request, instance: n1, job: hashi, limit: bytes, severity: warning}
            exp_annotations:
              summary: shed or refused traffic from peer A (bytes)
              description: *peer_shed
          - exp_labels: {peer: A, budget: work, instance: n1, job: hashi, limit: bytes, severity: warning}
            exp_annotations:
              summary: shed or refused traffic from peer A (bytes)
              description: *peer_shed
          - exp_labels: {peer: A, instance: n1, job: hashi, limit: connections, severity: warning}
            exp_annotations:
              summary: shed or refused traffic from peer A (connections)
              description: *peer_shed

  - name: single-failed-scrape-does-not-refire-an-old-shed
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '60x179 stale 60x70'
      - series: 'hashi_peer_requests_too_large_total{peer="A",instance="n1",job="hashi"}'
        values: '0x9 1x169 stale 1x70'
    alert_rule_test:
      - eval_time: 200m
        alertname: HashiPeerShed
        exp_alerts: []
      - eval_time: 240m
        alertname: HashiPeerShed
        exp_alerts: []

  - name: outage-longer-than-the-window-does-not-refire-old-sheds
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '60x99 _x80 60x100'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="B",instance="n1",job="hashi"}'
        values: '60x99 _x80 60x100'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="C",instance="n1",job="hashi"}'
        values: '60x99 _x80 60x100'
      - series: 'hashi_peer_mpc_work_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '0x9 1x89 _x80 1x100'
      - series: 'hashi_peer_mpc_work_shed_total{peer="B",instance="n1",job="hashi"}'
        values: '0x9 1x89 _x80 1x100'
      - series: 'hashi_peer_mpc_work_shed_total{peer="C",instance="n1",job="hashi"}'
        values: '0x9 1x89 _x80 1x100'
    alert_rule_test:
      - eval_time: 185m
        alertname: HashiPeersShedAtOnce
        exp_alerts: []
      - eval_time: 230m
        alertname: HashiPeerShed
        exp_alerts: []

  - name: host-reboot-does-not-refire-old-sheds
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '60x99 _x2 6120x30'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="B",instance="n1",job="hashi"}'
        values: '60x99 _x2 6120x30'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="C",instance="n1",job="hashi"}'
        values: '60x99 _x2 6120x30'
      - series: 'hashi_peer_mpc_work_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '5x99'
      - series: 'hashi_peer_mpc_work_shed_total{peer="B",instance="n1",job="hashi"}'
        values: '5x99'
      - series: 'hashi_peer_mpc_work_shed_total{peer="C",instance="n1",job="hashi"}'
        values: '5x99'
    alert_rule_test:
      - eval_time: 103m
        alertname: HashiPeersShedAtOnce
        exp_alerts: []
      - eval_time: 103m
        alertname: HashiPeerShed
        exp_alerts: []

  - name: three-peers-shed-within-ten-minutes
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '60x200'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="B",instance="n1",job="hashi"}'
        values: '60x200'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="C",instance="n1",job="hashi"}'
        values: '60x200'
      - series: 'hashi_peer_mpc_work_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '0x69 1x30'
      - series: 'hashi_peer_requests_over_byte_budget_total{peer="B",budget="work",instance="n1",job="hashi"}'
        values: '0x71 1x30'
      - series: 'hashi_peer_requests_shed_total{peer="C",instance="n1",job="hashi"}'
        values: '0x74 1x30'
    alert_rule_test:
      - eval_time: 72m
        alertname: HashiPeersShedAtOnce
        exp_alerts: []
      - eval_time: 76m
        alertname: HashiPeersShedAtOnce
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: critical}
            exp_annotations:
              summary: 3 peers shed at the request or MPC work limits
              description: &peers_shed >-
                Usually this node is slow, not the peers, though colluding members
                can also cause it. Check hashi_request_latency.
      - eval_time: 82m
        alertname: HashiPeersShedAtOnce
        exp_alerts: []

  - name: three-new-peers-shed-in-their-first-samples
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '_x89 5310x30'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="B",instance="n1",job="hashi"}'
        values: '_x89 5310x30'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="C",instance="n1",job="hashi"}'
        values: '_x89 5310x30'
      - series: 'hashi_peer_mpc_work_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '_x89 1x30'
      - series: 'hashi_peer_requests_over_byte_budget_total{peer="B",budget="work",instance="n1",job="hashi"}'
        values: '_x89 1x30'
      - series: 'hashi_peer_requests_shed_total{peer="C",instance="n1",job="hashi"}'
        values: '_x89 1x30'
    alert_rule_test:
      - eval_time: 95m
        alertname: HashiPeersShedAtOnce
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: critical}
            exp_annotations:
              summary: 3 peers shed at the request or MPC work limits
              description: *peers_shed
      - eval_time: 105m
        alertname: HashiPeersShedAtOnce
        exp_alerts: []

  - name: one-peer-across-several-terms-counts-once
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '60x200'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="B",instance="n1",job="hashi"}'
        values: '60x200'
      - series: 'hashi_peer_mpc_work_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '0x69 1x30'
      - series: 'hashi_peer_requests_over_byte_budget_total{peer="A",budget="work",instance="n1",job="hashi"}'
        values: '0x69 1x30'
      - series: 'hashi_peer_requests_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '0x69 1x30'
      - series: 'hashi_peer_requests_shed_total{peer="B",instance="n1",job="hashi"}'
        values: '0x69 1x30'
    alert_rule_test:
      - eval_time: 75m
        alertname: HashiPeersShedAtOnce
        exp_alerts: []

  - name: page-does-not-refire-after-one-failed-scrape
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '60x119 stale 60x30'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="B",instance="n1",job="hashi"}'
        values: '60x119 stale 60x30'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="C",instance="n1",job="hashi"}'
        values: '60x119 stale 60x30'
      - series: 'hashi_peer_mpc_work_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '0x29 1x89 stale 1x30'
      - series: 'hashi_peer_mpc_work_shed_total{peer="B",instance="n1",job="hashi"}'
        values: '0x29 1x89 stale 1x30'
      - series: 'hashi_peer_mpc_work_shed_total{peer="C",instance="n1",job="hashi"}'
        values: '0x29 1x89 stale 1x30'
    alert_rule_test:
      - eval_time: 100m
        alertname: HashiPeersShedAtOnce
        exp_alerts: []
      - eval_time: 130m
        alertname: HashiPeersShedAtOnce
        exp_alerts: []

  - name: peers-on-different-nodes-are-not-added-together
    interval: 1m
    input_series:
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="A",instance="n1",job="hashi"}'
        values: '60x200'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="B",instance="n1",job="hashi"}'
        values: '60x200'
      - series: 'hashi_peer_first_seen_timestamp_seconds{peer="C",instance="n2",job="hashi"}'
        values: '60x200'
      - series: 'hashi_peer_mpc_work_shed_total{peer="A",instance="n1",job="hashi"}'
        values: '0x69 1x30'
      - series: 'hashi_peer_mpc_work_shed_total{peer="B",instance="n1",job="hashi"}'
        values: '0x69 1x30'
      - series: 'hashi_peer_mpc_work_shed_total{peer="C",instance="n2",job="hashi"}'
        values: '0x69 1x30'
    alert_rule_test:
      - eval_time: 75m
        alertname: HashiPeersShedAtOnce
        exp_alerts: []

  - name: unguarded-mpc-work
    interval: 1m
    input_series:
      - series: 'hashi_mpc_unguarded_spawn_blocking_total{instance="n1",job="hashi"}'
        values: '0x59 1x60 stale _x3 0x10 1x60'
    alert_rule_test:
      - eval_time: 59m
        alertname: HashiMpcWorkUnguarded
        exp_alerts: []
      - eval_time: 65m
        alertname: HashiMpcWorkUnguarded
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: warning}
            exp_annotations:
              summary: MPC work started outside the per-peer budget
              description: &unguarded >-
                A node bug. Report it to the hashi team with the node's version.
      - eval_time: 140m
        alertname: HashiMpcWorkUnguarded
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: warning}
            exp_annotations:
              summary: MPC work started outside the per-peer budget
              description: *unguarded

  # The tip advances every 10 minutes until 60m, then stops while synced.
  - name: btc-view-frozen-while-synced
    interval: 1m
    input_series:
      - series: 'hashi_kyoto_best_height{instance="n1",job="hashi"}'
        values: '100x9 101x9 102x9 103x9 104x9 105x9 106x160'
      - series: 'hashi_kyoto_synced{instance="n1",job="hashi"}'
        values: '1x220'
    alert_rule_test:
      - eval_time: 160m
        alertname: HashiBtcViewFrozen
        exp_alerts: []
      - eval_time: 170m
        alertname: HashiBtcViewFrozen
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: critical}
            exp_annotations:
              summary: BTC view frozen
              description: >-
                hashi_kyoto_best_height has not changed in 90 minutes. Signet
                ticks roughly every 10 minutes, so the node's Bitcoin view is
                stuck (kyoto wedged, no peers, or bitcoind issue).

  # A new process: the Bitcoin client reads 0 through a 35-minute boot scrape.
  - name: btc-rules-wait-out-the-boot-scrape
    interval: 1m
    input_series:
      - series: 'hashi_onchain_scrape_in_progress{instance="n1",job="hashi"}'
        values: '1x35 0x100'
      - series: 'hashi_kyoto_best_height{instance="n1",job="hashi"}'
        values: '0x135'
      - series: 'hashi_kyoto_synced{instance="n1",job="hashi"}'
        values: '0x60 1x75'
      - series: 'hashi_kyoto_connected_peers{instance="n1",job="hashi"}'
        values: '0x40 8x95'
    alert_rule_test:
      - eval_time: 35m
        alertname: HashiBtcNotSynced
        exp_alerts: []
      - eval_time: 35m
        alertname: HashiNoBtcPeers
        exp_alerts: []
      - eval_time: 35m
        alertname: HashiBtcViewFrozen
        exp_alerts: []
      - eval_time: 45m
        alertname: HashiNoBtcPeers
        exp_alerts: []
      - eval_time: 55m
        alertname: HashiBtcNotSynced
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: warning}
            exp_annotations:
              summary: BTC view not synced for 15m
              description: >-
                Brief resyncs after a restart are normal; sustained unsync is
                not. Check hashi_kyoto_sync_percent and peer count.
      - eval_time: 65m
        alertname: HashiBtcNotSynced
        exp_alerts: []

  - name: no-btc-peers-after-the-boot-scrape
    interval: 1m
    input_series:
      - series: 'hashi_onchain_scrape_in_progress{instance="n1",job="hashi"}'
        values: '1x35 0x60'
      - series: 'hashi_kyoto_connected_peers{instance="n1",job="hashi"}'
        values: '0x95'
    alert_rule_test:
      - eval_time: 60m
        alertname: HashiNoBtcPeers
        exp_alerts: []
      - eval_time: 70m
        alertname: HashiNoBtcPeers
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: warning}
            exp_annotations:
              summary: no BTC peers connected
              description: Without peers the BTC tip will go stale next.

  # The timestamp reads 0 through a 35-minute boot scrape, then tracks the
  # clock until the watcher stops at 75m.
  - name: sui-mirror-stale-after-the-boot-scrape
    interval: 1m
    input_series:
      - series: 'hashi_latest_checkpoint_timestamp_ms{instance="n1",job="hashi"}'
        values: '0x34 2100000+60000x40 4500000x60'
    alert_rule_test:
      - eval_time: 34m
        alertname: HashiSuiMirrorStale
        exp_alerts: []
      - eval_time: 83m
        alertname: HashiSuiMirrorStale
        exp_alerts: []
      - eval_time: 90m
        alertname: HashiSuiMirrorStale
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: critical}
            exp_annotations:
              summary: Sui state mirror stale
              description: >-
                No Sui checkpoint newer than 5 minutes has been applied to the
                node's bridge-state mirror for 5 minutes. The watcher, mirror, or
                fullnode RPC is wedged or falling behind; the node is acting on
                stale state even if other metrics look healthy.

  - name: low-gas-ignores-the-unread-balance
    interval: 1m
    input_series:
      - series: 'hashi_sui_balance{address="0xa",instance="n1",job="hashi"}'
        values: '-1x10 2000000000x60'
    alert_rule_test:
      - eval_time: 9m
        alertname: HashiLowGas
        exp_alerts: []
      - eval_time: 35m
        alertname: HashiLowGas
        exp_alerts: []
      - eval_time: 45m
        alertname: HashiLowGas
        exp_alerts:
          - exp_labels: {address: 0xa, instance: n1, job: hashi, severity: warning}
            exp_annotations:
              summary: operator wallet below 5 SUI
              description: Refill the operator gas wallet.

  # mpc_service stops heartbeating at 10m with no reconfiguration running.
  - name: task-wedged-for-twenty-minutes
    interval: 1m
    input_series:
      - series: 'hashi_task_last_iteration_timestamp_seconds{task="mpc_service",instance="n1",job="hashi"}'
        values: '0+60x10 600x60'
      - series: 'hashi_reconfig_in_progress{instance="n1",job="hashi"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 28m
        alertname: HashiTaskWedged
        exp_alerts: []
      - eval_time: 35m
        alertname: HashiTaskWedged
        exp_alerts:
          - exp_labels: {task: mpc_service, instance: n1, job: hashi, severity: critical}
            exp_annotations:
              summary: task loop mpc_service wedged
              description: >-
                The mpc_service loop has not recorded a heartbeat in 20
                minutes. It has deadlocked or is stuck; check its logs.

  # A 25-minute reconfiguration: mpc_service records no heartbeat, but the
  # state watcher must keep its own.
  - name: task-wedged-respects-a-running-reconfiguration
    interval: 1m
    input_series:
      - series: 'hashi_task_last_iteration_timestamp_seconds{task="mpc_service",instance="n1",job="hashi"}'
        values: '0+60x10 600x25 2160+60x30'
      - series: 'hashi_task_last_iteration_timestamp_seconds{task="state_watcher",instance="n1",job="hashi"}'
        values: '0+60x10 600x60'
      - series: 'hashi_reconfig_in_progress{instance="n1",job="hashi"}'
        values: '0x9 1x26 0x40'
    alert_rule_test:
      - eval_time: 36m
        alertname: HashiTaskWedged
        exp_alerts:
          - exp_labels: {task: state_watcher, instance: n1, job: hashi, severity: critical}
            exp_annotations:
              summary: task loop state_watcher wedged
              description: >-
                The state_watcher loop has not recorded a heartbeat in 20
                minutes. It has deadlocked or is stuck; check its logs.
      - eval_time: 50m
        alertname: HashiTaskWedged
        exp_alerts:
          - exp_labels: {task: state_watcher, instance: n1, job: hashi, severity: critical}
            exp_annotations:
              summary: task loop state_watcher wedged
              description: >-
                The state_watcher loop has not recorded a heartbeat in 20
                minutes. It has deadlocked or is stuck; check its logs.

  - name: node-metrics-disappear
    interval: 1m
    input_series:
      - series: 'hashi_db_poisoned{instance="n1",job="hashi"}'
        values: '0x30 stale'
    alert_rule_test:
      - eval_time: 20m
        alertname: HashiNodeMetricsAbsent
        exp_alerts: []
      - eval_time: 35m
        alertname: HashiNodeMetricsAbsent
        exp_alerts: []
      - eval_time: 45m
        alertname: HashiNodeMetricsAbsent
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "hashi node metrics are missing"
              description: &hashiNodeMetricsAbsent >-
                No hashi node metrics for 10 minutes: the node is down, crash looping
                before it serves metrics, or no longer scraped. Every other node rule
                is silent while this fires.

  # sui-node's own uptime restarts just as often and must not count.
  - name: node-restarts-every-ten-minutes
    interval: 1m
    input_series:
      - series: 'uptime{hashi_object_id="0x1",instance="n1",job="hashi"}'
        values: '0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x30'
      - series: 'uptime{instance="n1",job="sui"}'
        values: '0+60x9 0+60x9 0+60x9 0+60x9 0+60x9 0+60x30'
    alert_rule_test:
      - eval_time: 55m
        alertname: HashiNodeRestarting
        exp_alerts:
          - exp_labels: {hashi_object_id: 0x1, instance: n1, job: hashi, severity: warning}
            exp_annotations:
              summary: "hashi node restarted more than 3 times in an hour"
              description: &hashiNodeRestarting >-
                The node is crash looping. Each restart repeats the boot scrape of
                on-chain state, so it may never finish booting; check the logs of the
                previous run.

  - name: one-restart-is-not-a-crash-loop
    interval: 1m
    input_series:
      - series: 'uptime{hashi_object_id="0x1",instance="n1",job="hashi"}'
        values: '0+60x29 0+60x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: HashiNodeRestarting
        exp_alerts: []

  # Each boot scrapes for 25 minutes, then the node crashes.
  - name: boot-scrape-restarts-in-a-crash-loop
    interval: 1m
    input_series:
      - series: 'hashi_onchain_scrape_in_progress{instance="n1",job="hashi"}'
        values: '1x25 0x2 1x25 0x2 1x25 0x2 1x25 0x2 1x25'
    alert_rule_test:
      - eval_time: 85m
        alertname: HashiOnchainScrapeStuck
        exp_alerts: []
      - eval_time: 100m
        alertname: HashiOnchainScrapeStuck
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: warning}
            exp_annotations:
              summary: "on-chain state scrape running for over 90 minutes"
              description: &hashiOnchainScrapeStuck >-
                The node's scrape of on-chain state has run, or restarted, for more
                than 90 minutes, and the node serves nothing until it finishes. Check
                hashi_onchain_scrape_pages_total for progress and the fullnode it
                reads from.

  - name: one-long-boot-scrape
    interval: 1m
    input_series:
      - series: 'hashi_onchain_scrape_in_progress{instance="n1",job="hashi"}'
        values: '1x35 0x100'
    alert_rule_test:
      - eval_time: 100m
        alertname: HashiOnchainScrapeStuck
        exp_alerts: []

  - name: node-fails-a-tenth-of-served-requests
    interval: 1m
    input_series:
      - series: 'hashi_requests{path="/p",role="server",status="ok",instance="n1",job="hashi"}'
        values: '0+90x60'
      - series: 'hashi_requests{path="/p",role="server",status="internal",instance="n1",job="hashi"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: HashiRequestErrors
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: warning}
            exp_annotations:
              summary: "node fails over 5% of the requests it serves"
              description: &hashiRequestErrors >-
                The node has failed over 5% of the peer requests it serves (internal,
                unknown or 5xx) for 15 minutes. Its logs name the failing path.

  - name: unsealed-batch-refusals-are-not-failures
    interval: 1m
    input_series:
      - series: 'hashi_requests{path="/p",role="server",status="ok",instance="n1",job="hashi"}'
        values: '0+50x60'
      - series: 'hashi_requests{path="/p",role="server",status="unavailable",instance="n1",job="hashi"}'
        values: '0+50x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: HashiRequestErrors
        exp_alerts: []

  - name: a-tenth-of-requests-take-over-ten-seconds
    interval: 1m
    input_series:
      - series: 'hashi_request_latency_bucket{path="/p",role="server",le="1",instance="n1",job="hashi"}'
        values: '0+50x60'
      - series: 'hashi_request_latency_bucket{path="/p",role="server",le="10",instance="n1",job="hashi"}'
        values: '0+90x60'
      - series: 'hashi_request_latency_bucket{path="/p",role="server",le="30",instance="n1",job="hashi"}'
        values: '0+100x60'
      - series: 'hashi_request_latency_bucket{path="/p",role="server",le="+Inf",instance="n1",job="hashi"}'
        values: '0+100x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: HashiRequestLatency
        exp_alerts: []
      - eval_time: 45m
        alertname: HashiRequestLatency
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: warning}
            exp_annotations:
              summary: "node takes over 10s at p99 to serve requests"
              description: &hashiRequestLatency >-
                The node has taken over 10 seconds at p99 to serve peer requests for
                30 minutes, so peers time out on it. Check its CPU and database, and
                the latency of its fullnode and bitcoind.

  - name: all-requests-under-ten-seconds
    interval: 1m
    input_series:
      - series: 'hashi_request_latency_bucket{path="/p",role="server",le="1",instance="n1",job="hashi"}'
        values: '0+50x60'
      - series: 'hashi_request_latency_bucket{path="/p",role="server",le="10",instance="n1",job="hashi"}'
        values: '0+100x60'
      - series: 'hashi_request_latency_bucket{path="/p",role="server",le="30",instance="n1",job="hashi"}'
        values: '0+100x60'
      - series: 'hashi_request_latency_bucket{path="/p",role="server",le="+Inf",instance="n1",job="hashi"}'
        values: '0+100x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: HashiRequestLatency
        exp_alerts: []

  - name: node-loses-its-key
    interval: 1m
    input_series:
      - series: 'hashi_mpc_committee_key_lost_total{instance="n1",job="hashi"}'
        values: '0x30 1x30'
      - series: 'hashi_mpc_recovery_suspicious_total{instance="n1",job="hashi"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: HashiMpcKeyStateInconsistent
        exp_alerts: []
      - eval_time: 35m
        alertname: HashiMpcKeyStateInconsistent
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: critical}
            exp_annotations:
              summary: "local MPC key state disagrees with the chain"
              description: &hashiMpcKeyStateInconsistent >-
                The node found no local key matching its on-chain registration, or
                recovered a key that contradicts the on-chain record. It cannot
                contribute signatures until its key state is repaired; capture its
                logs before restarting it.

  - name: two-thirds-of-signing-attempts-fail
    interval: 1m
    input_series:
      - series: 'hashi_mpc_sign_failures_total{reason="timeout",instance="n1",job="hashi"}'
        values: '0+1x90'
      - series: 'hashi_mpc_sign_duration_seconds_count{outcome="success",instance="n1",job="hashi"}'
        values: '0+0.5x90'
      - series: 'hashi_mpc_sign_duration_seconds_count{outcome="failure",instance="n1",job="hashi"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 60m
        alertname: HashiMpcSigningFailing
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: warning}
            exp_annotations:
              summary: "node fails over half its MPC signing attempts"
              description: &hashiMpcSigningFailing >-
                The node has failed over half of its MPC signing attempts in the past
                hour, for 30 minutes, so withdrawals are not getting its partial
                signatures. Check hashi_mpc_sign_failures_total by reason, and its
                logs.

  - name: pool-exhaustion-does-not-count-as-signing-failure
    interval: 1m
    input_series:
      - series: 'hashi_mpc_sign_failures_total{reason="timeout",instance="n1",job="hashi"}'
        values: '0+0.5x90'
      - series: 'hashi_mpc_sign_failures_total{reason="pool_exhausted",instance="n1",job="hashi"}'
        values: '0+5x90'
      - series: 'hashi_mpc_sign_duration_seconds_count{outcome="success",instance="n1",job="hashi"}'
        values: '0+2x90'
      - series: 'hashi_mpc_sign_duration_seconds_count{outcome="failure",instance="n1",job="hashi"}'
        values: '0+0.5x90'
    alert_rule_test:
      - eval_time: 75m
        alertname: HashiMpcSigningFailing
        exp_alerts: []

  - name: limiter-drifts
    interval: 1m
    input_series:
      - series: 'hashi_guardian_limiter_drifted{instance="n1",job="hashi"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: HashiGuardianLimiterDrifted
        exp_alerts: []
      - eval_time: 20m
        alertname: HashiGuardianLimiterDrifted
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: warning}
            exp_annotations:
              summary: "local guardian limiter out of lockstep with the guardian"
              description: &hashiGuardianLimiterDrifted >-
                The node's copy of the guardian's rate limiter failed to apply a
                signed withdrawal, so it won't reliably enforce the limit until it
                reconciles. If the flag stays set, restart the node to re-seed it.

  - name: binary-behind-the-chain
    interval: 1m
    input_series:
      - series: 'hashi_package_version_unsupported{instance="n1",job="hashi"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 18m
        alertname: HashiBinaryBehindChain
        exp_alerts: []
      - eval_time: 25m
        alertname: HashiBinaryBehindChain
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: critical}
            exp_annotations:
              summary: "binary does not support the live package version"
              description: &hashiBinaryBehindChain >-
                The chain has moved past every package version this build implements;
                autonomous writes are halted. Upgrade the node binary immediately.

  - name: database-poisoned
    interval: 1m
    input_series:
      - series: 'hashi_db_poisoned{instance="n1",job="hashi"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: HashiDbPoisoned
        exp_alerts: []
      - eval_time: 20m
        alertname: HashiDbPoisoned
        exp_alerts:
          - exp_labels: {instance: n1, job: hashi, severity: critical}
            exp_annotations:
              summary: "database poisoned; restart required"
              description: &hashiDbPoisoned >-
                fjall refused a write after a failed flush or fsync (usually a full
                disk) and will refuse every write until the process restarts; reads
                and signing carry on looking healthy. Free the disk, then restart the
                node.
