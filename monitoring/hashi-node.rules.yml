# Prometheus alerting rules for a hashi node. docs/alerting.md says which rule
# files to load and which metrics not to alert on.
#
# Add this file to your Prometheus rule_files and route on `severity`.
# Expressions assume your node's hashi metrics are scraped into the local
# Prometheus without extra relabeling.

groups:
  - name: hashi-node-health
    interval: 1m
    rules:
      # The Bitcoin client starts only after the boot scrape of on-chain state,
      # which takes 20-35 minutes on testnet; until then its gauges read 0.
      - alert: HashiBtcViewFrozen
        expr: changes(hashi_kyoto_best_height[90m]) == 0 and hashi_kyoto_synced == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "BTC view frozen"
          description: >-
            hashi_kyoto_best_height has not changed in 90 minutes. Signet
            ticks roughly every 10 minutes, so the node's Bitcoin view is
            stuck (kyoto wedged, no peers, or bitcoind issue).

      - alert: HashiBtcNotSynced
        expr: hashi_kyoto_synced == 0 unless hashi_onchain_scrape_in_progress == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "BTC view not synced for 15m"
          description: >-
            Brief resyncs after a restart are normal; sustained unsync is
            not. Check hashi_kyoto_sync_percent and peer count.

      # Each light-client restart briefly drops the peer count to 0.
      - alert: HashiNoBtcPeers
        expr: hashi_kyoto_connected_peers < 1 unless hashi_onchain_scrape_in_progress == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "no BTC peers connected"
          description: "Without peers the BTC tip will go stale next."

      # The checkpoint timestamp reads 0 until the boot scrape ends. A higher
      # threshold lets a chronically slow watcher flap in and out of the alert.
      - alert: HashiSuiMirrorStale
        expr: time() - (hashi_latest_checkpoint_timestamp_ms > 0) / 1000 > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Sui state mirror stale"
          description: >-
            No Sui checkpoint newer than 5 minutes has been applied to the
            node's bridge-state mirror for 5 minutes. The watcher, mirror, or
            fullnode RPC is wedged or falling behind; the node is acting on
            stale state even if other metrics look healthy.

      # Each task loop heartbeats at least every 15s when idle, but mpc_service
      # records none while a reconfiguration runs.
      - alert: HashiTaskWedged
        expr: |
          time() - hashi_task_last_iteration_timestamp_seconds{task!="mpc_service"} > 600
            or (time() - hashi_task_last_iteration_timestamp_seconds{task="mpc_service"} > 600
              unless ignoring (task) hashi_reconfig_in_progress == 1)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "task loop {{ $labels.task }} wedged"
          description: >-
            The {{ $labels.task }} loop has not recorded a heartbeat in 20
            minutes. It has deadlocked or is stuck; check its logs.

      # -1 means the balance has not been read yet. Busy nodes burn over 10 SUI
      # a day.
      - alert: HashiLowGas
        expr: (hashi_sui_balance >= 0) < 5e9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "operator wallet below 5 SUI"
          description: "Refill the operator gas wallet."

      - alert: HashiBinaryBehindChain
        expr: hashi_package_version_unsupported == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "binary does not support the live package version"
          description: >-
            The chain has moved past every package version this build
            implements; autonomous writes are halted. Upgrade the node
            binary immediately.

      - alert: HashiDbPoisoned
        expr: hashi_db_poisoned == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "database poisoned; restart required"
          description: >-
            fjall refused a write after a failed flush or fsync (usually a
            full disk) and will refuse every write until the process
            restarts; reads and signing carry on looking healthy. Free the
            disk, then restart the node.

      # Every release since testnet-1.0 exports hashi_db_poisoned from startup,
      # so its absence means the node is down or no longer scraped.
      - alert: HashiNodeMetricsAbsent
        expr: absent(hashi_db_poisoned)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "hashi node metrics are missing"
          description: >-
            No hashi node metrics for 10 minutes: the node is down, crash
            looping before it serves metrics, or no longer scraped. Every other
            node rule is silent while this fires.

      # sui-node also exports `uptime`; hashi's carries hashi_object_id.
      - alert: HashiNodeRestarting
        expr: resets(uptime{hashi_object_id!=""}[1h]) > 3
        labels:
          severity: warning
        annotations:
          summary: "hashi node restarted more than 3 times in an hour"
          description: >-
            The node is crash looping. Each restart repeats the boot scrape of
            on-chain state, so it may never finish booting; check the logs of
            the previous run.

      # The boot scrape takes 20-35 minutes on testnet. max_over_time keeps a
      # crash-looping node, which starts the scrape again on each boot, firing.
      - alert: HashiOnchainScrapeStuck
        expr: max_over_time(hashi_onchain_scrape_in_progress[30m]) == 1
        for: 90m
        labels:
          severity: warning
        annotations:
          summary: "on-chain state scrape running for over 90 minutes"
          description: >-
            The node's scrape of on-chain state has run, or restarted, for more
            than 90 minutes, and the node serves nothing until it finishes.
            Check hashi_onchain_scrape_pages_total for progress and the
            fullnode it reads from.

      # Only codes where the node failed: unavailable means a presignature batch
      # isn't sealed yet, and failed-precondition is a refusal to sign.
      - alert: HashiRequestErrors
        expr: |
          sum without (path, status, role) (rate(hashi_requests{role="server", status=~"internal|unknown|data-loss|unimplemented|5[0-9]{2}"}[10m]))
            / sum without (path, status, role) (rate(hashi_requests{role="server"}[10m]))
            > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "node fails over 5% of the requests it serves"
          description: >-
            The node has failed over 5% of the peer requests it serves
            (internal, unknown or 5xx) for 15 minutes. Its logs name the
            failing path.

      # Healthy nodes reach about 8.5 seconds at p99 on their slowest path.
      - alert: HashiRequestLatency
        expr: histogram_quantile(0.99, sum without (path, role) (rate(hashi_request_latency_bucket{role="server"}[10m]))) > 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "node takes over 10s at p99 to serve requests"
          description: >-
            The node has taken over 10 seconds at p99 to serve peer requests
            for 30 minutes, so peers time out on it. Check its CPU and
            database, and the latency of its fullnode and bitcoind.

  - name: hashi-node-signing
    interval: 1m
    rules:
      - alert: HashiRotationPreviousSharesMissing
        expr: increase(hashi_mpc_rotation_previous_shares_missing_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "held previous-epoch weight but reshared nothing"
          description: >-
            This node owned share indices in the previous committee but entered
            the rotation with none to reshare, so its weight did not reach the
            new key.

      - alert: HashiComplaintWithheld
        expr: increase(hashi_mpc_complaints_withheld_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "withheld the response to a verified MPC complaint"
          description: >-
            A peer sent a complaint that verified, so some dealer sent it a
            corrupt share, and the dealer is outside this node's
            complaint-response-policy, so the peer cannot recover its share
            until operators coordinate a fix. Honest nodes never trigger this.
            Never add a complaint-response-policy entry on your own: one wrong
            entry can leak your shares.

      - alert: HashiWithdrawalFailsBitcoinScripts
        expr: increase(hashi_withdrawal_bitcoin_check_script_failures_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "bitcoind says a signed withdrawal is invalid"
          description: >-
            If other operators see it too, withdrawals are broken: raise it in
            the operator channel. Otherwise check this node's bitcoind.

      # An hourly probe sets this; -1 means no pool UTXO has been probed yet.
      - alert: HashiWithdrawalCheckBlind
        expr: hashi_withdrawal_bitcoin_check_blind == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "withdrawal check is blind"
          description: >-
            This node's bitcoind cannot check withdrawals, so the node signs
            them unchecked. Usually testmempoolaccept is not allowed on the RPC
            endpoint; see the error log.

      # increase() misses a shed in a series' first sample, so each term also
      # fires on a count sampled after the peer was first seen in the window.
      - alert: HashiPeerShed
        expr: |
          label_replace(
            (increase(hashi_peer_requests_shed_total[1h]) > 0)
            or (hashi_peer_requests_shed_total > 0
              and ignoring (budget) time() - hashi_peer_first_seen_timestamp_seconds < 3600
              and timestamp(hashi_peer_requests_shed_total) >= ignoring (budget) group_left () hashi_peer_first_seen_timestamp_seconds),
            "limit", "count", "", "")
          or label_replace(
            (increase(hashi_peer_requests_over_byte_budget_total[1h]) > 0)
            or (hashi_peer_requests_over_byte_budget_total > 0
              and ignoring (budget) time() - hashi_peer_first_seen_timestamp_seconds < 3600
              and timestamp(hashi_peer_requests_over_byte_budget_total) >= ignoring (budget) group_left () hashi_peer_first_seen_timestamp_seconds),
            "limit", "bytes", "", "")
          or label_replace(
            (increase(hashi_peer_requests_too_large_total[1h]) > 0)
            or (hashi_peer_requests_too_large_total > 0
              and ignoring (budget) time() - hashi_peer_first_seen_timestamp_seconds < 3600
              and timestamp(hashi_peer_requests_too_large_total) >= ignoring (budget) group_left () hashi_peer_first_seen_timestamp_seconds),
            "limit", "size", "", "")
          or label_replace(
            (increase(hashi_peer_mpc_work_shed_total[1h]) > 0)
            or (hashi_peer_mpc_work_shed_total > 0
              and ignoring (budget) time() - hashi_peer_first_seen_timestamp_seconds < 3600
              and timestamp(hashi_peer_mpc_work_shed_total) >= ignoring (budget) group_left () hashi_peer_first_seen_timestamp_seconds),
            "limit", "work", "", "")
          or label_replace(
            (increase(hashi_peer_responses_shed_total[1h]) > 0)
            or (hashi_peer_responses_shed_total > 0
              and ignoring (budget) time() - hashi_peer_first_seen_timestamp_seconds < 3600
              and timestamp(hashi_peer_responses_shed_total) >= ignoring (budget) group_left () hashi_peer_first_seen_timestamp_seconds),
            "limit", "response", "", "")
          or label_replace(
            (increase(hashi_peer_requests_over_connection_limit_total[1h]) > 0)
            or (hashi_peer_requests_over_connection_limit_total > 0
              and ignoring (budget) time() - hashi_peer_first_seen_timestamp_seconds < 3600
              and timestamp(hashi_peer_requests_over_connection_limit_total) >= ignoring (budget) group_left () hashi_peer_first_seen_timestamp_seconds),
            "limit", "connections", "", "")
        labels:
          severity: warning
        annotations:
          summary: "shed or refused traffic from peer {{ $labels.peer }} ({{ $labels.limit }})"
          description: >-
            The peer may be misbehaving, or this node may be slow or have its
            limits set too low. Rule this node out first (hashi_request_latency),
            then look the peer up with
            `hashi committee -c hashi-cli.toml view {{ $labels.peer }}`.

      - alert: HashiPeersShedAtOnce
        expr: |
          count without (peer) (max without (budget) (
            (increase(hashi_peer_requests_shed_total[10m]) > 0)
            or (hashi_peer_requests_shed_total > 0
              and ignoring (budget) time() - hashi_peer_first_seen_timestamp_seconds < 600
              and timestamp(hashi_peer_requests_shed_total) >= ignoring (budget) group_left () hashi_peer_first_seen_timestamp_seconds)
            or (increase(hashi_peer_mpc_work_shed_total[10m]) > 0)
            or (hashi_peer_mpc_work_shed_total > 0
              and ignoring (budget) time() - hashi_peer_first_seen_timestamp_seconds < 600
              and timestamp(hashi_peer_mpc_work_shed_total) >= ignoring (budget) group_left () hashi_peer_first_seen_timestamp_seconds)
            or (increase(hashi_peer_requests_over_byte_budget_total{budget="work"}[10m]) > 0)
            or (hashi_peer_requests_over_byte_budget_total{budget="work"} > 0
              and ignoring (budget) time() - hashi_peer_first_seen_timestamp_seconds < 600
              and timestamp(hashi_peer_requests_over_byte_budget_total{budget="work"}) >= ignoring (budget) group_left () hashi_peer_first_seen_timestamp_seconds)
          )) >= 3
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} peers shed at the request or MPC work limits"
          description: >-
            Usually this node is slow, not the peers, though colluding members
            can also cause it. Check hashi_request_latency.

      - alert: HashiMpcWorkUnguarded
        expr: increase(hashi_mpc_unguarded_spawn_blocking_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "MPC work started outside the per-peer budget"
          description: >-
            A node bug. Report it to the hashi team with the node's version.

      - alert: HashiMpcKeyStateInconsistent
        expr: |
          increase(hashi_mpc_committee_key_lost_total[30m]) > 0
            or increase(hashi_mpc_recovery_suspicious_total[30m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "local MPC key state disagrees with the chain"
          description: >-
            The node found no local key matching its on-chain registration, or
            recovered a key that contradicts the on-chain record. It cannot
            contribute signatures until its key state is repaired; capture its
            logs before restarting it.

      # Pool exhaustion is committee-wide and has its own fleet rule.
      - alert: HashiMpcSigningFailing
        expr: |
          sum without (reason) (increase(hashi_mpc_sign_failures_total{reason!="pool_exhausted"}[1h]))
            / sum without (outcome) (increase(hashi_mpc_sign_duration_seconds_count[1h]))
            > 0.5
          and sum without (reason) (increase(hashi_mpc_sign_failures_total{reason!="pool_exhausted"}[1h])) > 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "node fails over half its MPC signing attempts"
          description: >-
            The node has failed over half of its MPC signing attempts in the
            past hour, for 30 minutes, so withdrawals are not getting its
            partial signatures. Check hashi_mpc_sign_failures_total by reason,
            and its logs.

      # The flag stays set until the limiter reconciles with the guardian or the
      # node restarts.
      - alert: HashiGuardianLimiterDrifted
        expr: hashi_guardian_limiter_drifted > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "local guardian limiter out of lockstep with the guardian"
          description: >-
            The node's copy of the guardian's rate limiter failed to apply a
            signed withdrawal, so it won't reliably enforce the limit until it
            reconciles. If the flag stays set, restart the node to re-seed it.
