name: Build and deploy GitHub Pages preview for PRs

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - "design/**"
      - ".github/workflows/pages-preview.yaml"

concurrency: preview-${{ github.ref }}

permissions:
  contents: read

jobs:
  # Validates that the docs build on every PR (link checks, MDX syntax,
  # broken-anchor checks). Runs on all PR events except `closed`.
  build-with-linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: design/package-lock.json
        if: github.event.action != 'closed'
      - name: Install dependencies
        run: cd design && npm ci
        if: github.event.action != 'closed'
      - name: Build site
        run: cd design && npm run build
        if: github.event.action != 'closed'

  # Builds the preview without write access, so npm dependencies never see a
  # write token; `preview` publishes the result.
  preview-build:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'MystenLabs' && github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: design/package-lock.json
      - name: Install dependencies
        run: cd design && npm ci
      - name: Build site
        run: cd design && DOCUSAURUS_BASE_URL="/hashi/pr-preview/pr-${{ github.event.number }}/" npm run build
      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: preview-site
          path: design/build

  # Publishes the built site to gh-pages under /hashi/pr-preview/pr-<N>/
  # using rossjrw/pr-preview-action. On `closed`, the action removes the
  # preview directory and updates the PR comment.
  preview:
    runs-on: ubuntu-latest
    needs: preview-build
    if: >-
      !cancelled() && github.repository_owner == 'MystenLabs' &&
      (github.event.action == 'closed' || needs.preview-build.result == 'success')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Download site
        if: github.event.action != 'closed'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: preview-site
          path: design/build
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # pin@v1.8.1
        with:
          source-dir: design/build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
