name: Deterministic Docker Builds

on:
  pull_request:
  workflow_call:
    inputs:
      hashi_only:
        description: Only build and verify the hashi binary
        type: boolean
        required: false
        default: false
  workflow_dispatch:
  schedule: [cron: "20 3 * * *"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Two kernels and two Docker releases. Pinned rather than ubuntu-latest:
        # when -latest moves to 26.04 the pair would silently become one image.
        # ubuntu-22.04 is deprecated from 2026-09-17 and gone on 2027-04-17.
        os: [ubuntu-24.04, ubuntu-26.04]
        image: ${{ fromJSON(inputs.hashi_only && '[{"name":"hashi","dir":"hashi"}]' || '[{"name":"hashi","dir":"hashi"},{"name":"hashi-screener","dir":"hashi-screener"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7

      - name: Build ${{ matrix.image.name }} image
        env:
          GIT_REVISION: ${{ github.sha }}
          IMAGE_NAME: ${{ matrix.image.name }}
        run: bash docker/${{ matrix.image.dir }}/build.sh --no-cache

      - name: Compute sha256
        id: hash
        run: |
          BIN="out/${{ matrix.image.name }}"
          HASH=$(sha256sum "${BIN}" | awk '{print $1}')
          echo "sha256=${HASH}" >> "$GITHUB_OUTPUT"
          echo "${HASH}  ${{ matrix.image.name }}" > "out/${{ matrix.image.name }}.sha256"

      - name: Upload sha256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: ${{ matrix.image.name }}-${{ matrix.os }}-sha256
          if-no-files-found: error
          path: out/${{ matrix.image.name }}.sha256

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: ${{ matrix.image.name }}-${{ matrix.os }}-binary
          if-no-files-found: error
          path: out/${{ matrix.image.name }}

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.hashi_only && '["hashi"]' || '["hashi","hashi-screener"]') }}
    steps:
      - name: Download ubuntu-24.04 hash
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: ${{ matrix.image }}-ubuntu-24.04-sha256
          path: hash-2404

      - name: Download ubuntu-26.04 hash
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: ${{ matrix.image }}-ubuntu-26.04-sha256
          path: hash-2604

      - name: Compare hashes
        id: compare
        run: |
          U2404=$(awk '{print $1}' "hash-2404/${{ matrix.image }}.sha256")
          U2604=$(awk '{print $1}' "hash-2604/${{ matrix.image }}.sha256")
          echo "ubuntu2404=${U2404}" >> "$GITHUB_OUTPUT"
          echo "ubuntu2604=${U2604}" >> "$GITHUB_OUTPUT"
          if [ "${U2404}" = "${U2604}" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write summary
        run: |
          {
            echo "## ${{ matrix.image }} reproducibility"
            echo ""
            echo "| Runner | SHA-256 |"
            echo "|--------|---------|"
            echo "| ubuntu-24.04 | \`${{ steps.compare.outputs.ubuntu2404 }}\` |"
            echo "| ubuntu-26.04 | \`${{ steps.compare.outputs.ubuntu2604 }}\` |"
            echo ""
            echo "**Result**: ${{ steps.compare.outputs.match == 'true' && 'Reproducible' || 'MISMATCH' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if hashes differ
        if: steps.compare.outputs.match != 'true'
        run: |
          echo "${{ matrix.image }} binary hashes differ across runners!"
          exit 1
