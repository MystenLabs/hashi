name: gh-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  RUSTFLAGS: -D warnings

jobs:
  # Builds without write access, so npm dependencies and the fetched ts-sdks
  # README never see a write token; `deploy` publishes the result.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: rustdoc
        run: make doc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: design/package-lock.json

      - name: Install Docusaurus dependencies
        run: cd design && npm ci

      - name: Build Docusaurus site
        run: cd design && npm run build

      - name: Stage build artifacts
        run: |
          mkdir -p site
          mv ./target/doc site/rustdoc
          mv design/build site/design

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: site
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: site
          path: site

      # We deploy with `force_orphan: true` so the gh-pages branch stays a
      # single orphan commit (no history accumulation), but that wipes the
      # branch contents — which would blow away the `pr-preview/` directory
      # the .github/workflows/pages-preview.yaml workflow writes there.
      #
      # To keep both properties (single-commit history + live PR previews),
      # we explicitly fetch the previews of open PRs from gh-pages and carry
      # them into the deploy folder so they round-trip through the orphan
      # rewrite. Previews of closed PRs are dropped. This runs just before the
      # push so a preview published while the site builds isn't lost.
      - name: Preserve open PR previews from prior gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GH_PAGES_REF=$(git ls-remote origin refs/heads/gh-pages)
          if [ -z "$GH_PAGES_REF" ]; then
            echo "gh-pages branch does not exist yet — fresh deploy"
            exit 0
          fi
          OPEN_PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json number --jq '.[].number')
          git fetch origin gh-pages --depth=1
          git worktree add /tmp/gh-pages-prev origin/gh-pages
          mkdir -p site/pr-preview
          PRESERVED=0
          for PR in $OPEN_PRS; do
            if [ -d "/tmp/gh-pages-prev/pr-preview/pr-$PR" ]; then
              cp -R "/tmp/gh-pages-prev/pr-preview/pr-$PR" site/pr-preview/
              PRESERVED=$((PRESERVED + 1))
            fi
          done
          echo "Preserved $PRESERVED open PR preview(s)"
          git worktree remove --force /tmp/gh-pages-prev

      - name: Deploy Docs
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # pin@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
