name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule: [cron: "40 1 * * *"]

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings
  RUST_LOG_JSON: "0"

jobs:
  test:
    runs-on: ubuntu-ghcloud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The golden snapshot gate diffs against the merge commit's first parent.
          fetch-depth: 2

      - name: Check existing golden snapshots are unchanged (warn only)
        if: github.event_name == 'pull_request'
        env:
          GOLDEN_GATE_ENFORCE: "false"
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-golden-snapshots.sh

      - name: rust version
        run: |
          rustc --version
          cargo --version

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # pin@v2.87.22
        with:
          tool: cargo-nextest
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # pin@v2.87.22
        with:
          # Keep in step with the insta crate in Cargo.lock.
          tool: cargo-insta@1.48.0

      - name: Install Bitcoin Core
        env:
          # Fallback version if auto-detection fails
          FALLBACK_VERSION: "29.1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Get latest Bitcoin Core version from GitHub API
          echo "Detecting latest Bitcoin Core version..."
          BITCOIN_VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/bitcoin/bitcoin/releases/latest | \
            sed -n 's/.*"tag_name": "v\([^"]*\)".*/\1/p' || echo "$FALLBACK_VERSION")

          # Validate version was detected
          if [ -z "$BITCOIN_VERSION" ]; then
            echo "Failed to detect version, using fallback: $FALLBACK_VERSION"
            BITCOIN_VERSION="$FALLBACK_VERSION"
          fi

          echo "Installing Bitcoin Core v${BITCOIN_VERSION}..."

          # Download Bitcoin Core
          wget https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz || {
            echo "Download failed. The version ${BITCOIN_VERSION} might not be available on bitcoincore.org yet."
            echo "Falling back to version ${FALLBACK_VERSION}..."
            BITCOIN_VERSION="$FALLBACK_VERSION"
            wget https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz
          }

          echo "Extracting Bitcoin Core..."
          tar -xzf bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz

          # Move bitcoind to PATH
          echo "Installing Bitcoin Core binaries..."
          sudo mv bitcoin-${BITCOIN_VERSION}/bin/bitcoind /usr/local/bin/
          sudo mv bitcoin-${BITCOIN_VERSION}/bin/bitcoin-cli /usr/local/bin/

          # Cleanup
          rm -rf bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz bitcoin-${BITCOIN_VERSION}/

          # Verify installation
          echo "Verifying installation..."
          bitcoind --version

      - name: Install Sui Binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/install-sui.sh

      - name: Run tests
        env:
          # Keeps a repo insta config from force-passing the goldens under --check.
          INSTA_FORCE_PASS: "0"
        run: |
          cargo insta test --workspace --all-features --test-runner nextest --nextest-profile ci --check --unreferenced reject --disable-nextest-doctest
          cargo test --workspace --all-features --doc

      - name: Verify Guardian log attestation trust
        # --all-features enables non-enclave-dev, which bypasses Nitro verification.
        run: cargo test -p hashi-guardian attestation_is_verified_before_log_signatures

      - name: Detect TRM client changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # pin@v3.0.4
        id: trm-filter
        # Pull requests from forks don't get the TRM API key.
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          filters: |
            trm:
              - 'crates/hashi/src/trm/**'
              - '.github/workflows/ci.yml'

      - name: Run live TRM tests
        # These call TRM's API, so leave them to the PRs that change the client.
        if: steps.trm-filter.outputs.trm == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TRM_API_KEY: ${{ secrets.TRM_API_KEY }}
        run: cargo nextest run --workspace --all-features --profile ci --run-ignored only trm::tests::live

      - run: make is-dirty

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: rust version
        run: |
          rustc --version
          cargo --version

      - run: rustup component add rustfmt
      - run: rustup component add clippy

      # Install buf
      - name: Install buf
        uses: bufbuild/buf-setup-action@d5f79ca09dab494736bae6976ce973d76d8853e1 # pin@v1.24.0
        with:
          version: 1.47.2
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: rustfmt
        run: make check-fmt

      - name: clippy
        run: make clippy

      - name: clippy (real attestation arm)
        run: make clippy-enclave

      - run: make buf-lint
      - run: make proto

      - run: make is-dirty

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: rust version
        run: |
          rustc --version
          cargo --version

      - name: rustdoc
        run: make doc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: design/package-lock.json

      - name: Install Docusaurus dependencies
        run: cd design && npm ci

      - name: Build Docusaurus site
        run: cd design && npm run build

      - run: make is-dirty
