name: Release Hashi

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag, or commit (defaults to latest main, separate from the workflow ref)
        type: string
        required: false
        default: main
      network:
        description: Network to release
        type: choice
        required: true
        options:
          - devnet
          - testnet
      bump_contract_version:
        description: Bump X and reset Y after a Move contract upgrade (testnet only; does not deploy contracts)
        type: boolean
        required: false
        default: false

concurrency:
  group: hashi-release-${{ inputs.network }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve source commit
    if: inputs.network == 'devnet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout source ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false
      - name: Resolve source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  reserve:
    name: Reserve testnet release
    if: inputs.network == 'testnet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.reservation.outputs.sha }}
      release_tag: ${{ steps.reservation.outputs.release_tag }}
    steps:
      - name: Checkout workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Reserve source and release tag
        id: reservation
        env:
          SOURCE_REF: ${{ inputs.ref || 'main' }}
          BUMP_CONTRACT_VERSION: ${{ inputs.bump_contract_version }}
        run: |
          set -euo pipefail
          RESERVATION=$(bash "$GITHUB_WORKSPACE/scripts/release/reserve-testnet.sh" \
            --ref "$SOURCE_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --bump-contract-version "$BUMP_CONTRACT_VERSION")
          jq -r '"sha=\(.sha)", "release_tag=\(.release_tag)"' \
            <<< "$RESERVATION" >> "$GITHUB_OUTPUT"

  deterministic-build:
    if: inputs.network == 'testnet'
    needs: reserve
    uses: ./.github/workflows/deterministic-build.yml
    with:
      hashi_only: true
      source_sha: ${{ needs.reserve.outputs.sha }}

  publish:
    name: Verify and publish testnet release
    needs: [reserve, deterministic-build]
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      IMAGE: mysten/hashi
      SOURCE_SHA: ${{ needs.reserve.outputs.sha }}
      RELEASE_TAG: ${{ needs.reserve.outputs.release_tag }}
    steps:
      - name: Download verified binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: hashi-ubuntu-latest-binary
          path: release

      - name: Download verified checksum
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: hashi-ubuntu-latest-sha256
          path: release

      - name: Prepare release assets
        run: |
          set -euo pipefail
          EXPECTED_HASH=$(awk '{print $1}' release/hashi.sha256)
          ACTUAL_HASH=$(sha256sum release/hashi | awk '{print $1}')
          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "Downloaded binary hash does not match the verified build hash"
            exit 1
          fi

          mv release/hashi release/hashi-linux-amd64
          chmod +x release/hashi-linux-amd64
          printf '%s  %s\n' "$ACTUAL_HASH" hashi-linux-amd64 > release/SHA256SUMS
          echo "binary_hash=$ACTUAL_HASH" >> "$GITHUB_ENV"

      - name: Dispatch Docker image build
        env:
          GH_TOKEN: ${{ secrets.DOCKER_BINARY_BUILDS_DISPATCH }}
        run: |
          gh workflow run hashi-build-image.yml \
            --repo MystenLabs/sui-operations \
            --ref main \
            -f hashi_commit="$SOURCE_SHA" \
            -f push_to_dockerhub=true \
            -f release_tag="$RELEASE_TAG" \
            -f caller_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Wait for Docker image build
        env:
          GH_TOKEN: ${{ secrets.DOCKER_BINARY_BUILDS_DISPATCH }}
        run: |
          set -euo pipefail
          CALLER_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          EXPECTED_TITLE="Build Hashi image (${SOURCE_SHA}) [caller ${CALLER_ID}]"
          RUNS_ENDPOINT="repos/MystenLabs/sui-operations/actions/workflows/hashi-build-image.yml/runs"
          OPERATIONS_RUN_ID=

          for attempt in $(seq 1 60); do
            if RUNS=$(gh api --method GET "$RUNS_ENDPOINT" \
              -f event=workflow_dispatch \
              -f per_page=100); then
              OPERATIONS_RUN_ID=$(jq -r --arg title "$EXPECTED_TITLE" \
                '[.workflow_runs[] | select(.display_title == $title)][0].id // empty' <<< "$RUNS")
            else
              echo "Failed to list sui-operations workflow runs; retrying"
            fi
            if [ -n "$OPERATIONS_RUN_ID" ]; then
              break
            fi
            echo "Waiting for the sui-operations workflow run (attempt $attempt/60)"
            sleep 10
          done
          if [ -z "$OPERATIONS_RUN_ID" ]; then
            echo "Timed out finding the dispatched sui-operations workflow run"
            exit 1
          fi

          for attempt in $(seq 1 270); do
            if ! RUN=$(gh api "repos/MystenLabs/sui-operations/actions/runs/$OPERATIONS_RUN_ID"); then
              echo "Failed to inspect sui-operations run $OPERATIONS_RUN_ID; retrying"
              sleep 20
              continue
            fi
            STATUS=$(jq -r .status <<< "$RUN")
            CONCLUSION=$(jq -r '.conclusion // empty' <<< "$RUN")
            OPERATIONS_RUN_URL=$(jq -r .html_url <<< "$RUN")
            if [ "$STATUS" = completed ]; then
              if [ "$CONCLUSION" != success ]; then
                echo "sui-operations build concluded with $CONCLUSION: $OPERATIONS_RUN_URL"
                exit 1
              fi
              echo "operations_run_url=$OPERATIONS_RUN_URL" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for sui-operations run $OPERATIONS_RUN_ID ($STATUS, attempt $attempt/270)"
            sleep 20
          done
          echo "Timed out waiting for sui-operations run $OPERATIONS_RUN_ID"
          exit 1

      - name: Verify published image binary
        env:
          BINARY_URL: https://storage.googleapis.com/mysten-hashi-binaries/${{ needs.reserve.outputs.sha }}/hashi
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "$BINARY_URL" --output release/image-hashi; then
              IMAGE_BINARY_HASH=$(sha256sum release/image-hashi | awk '{print $1}')
              if [ "$IMAGE_BINARY_HASH" != "$binary_hash" ]; then
                echo "Published image binary hash does not match the release binary"
                exit 1
              fi
              exit 0
            fi
            echo "Waiting for the image binary (attempt $attempt/30)"
            sleep 20
          done
          echo "Timed out waiting for the image binary"
          exit 1

      - name: Resolve published image digest
        run: |
          set -euo pipefail
          TAG_URL="https://hub.docker.com/v2/repositories/$IMAGE/tags/$RELEASE_TAG"
          for attempt in $(seq 1 30); do
            if RESPONSE=$(curl --fail --silent --show-error "$TAG_URL"); then
              IMAGE_DIGEST=$(jq -r '.digest // empty' <<< "$RESPONSE")
              if [ -n "$IMAGE_DIGEST" ]; then
                echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            echo "Waiting for $IMAGE:$RELEASE_TAG (attempt $attempt/30)"
            sleep 20
          done
          echo "Timed out waiting for the Docker image"
          exit 1

      - name: Generate workflow provenance
        id: provenance
        uses: actions/attest-build-provenance/predicate@864457a58d4733d7f1574bd8821fa24e02cf7538 # pin@predicate@2.0.0

      - name: Record selected source in provenance
        env:
          PREDICATE: ${{ steps.provenance.outputs.predicate }}
          RELEASE_INPUTS: ${{ toJSON(inputs) }}
        run: |
          # Keep the workflow identity and separately record the source it built.
          jq --argjson inputs "$RELEASE_INPUTS" \
            --arg uri "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@${SOURCE_SHA}" \
            --arg sha "$SOURCE_SHA" \
            '.buildDefinition.externalParameters.inputs = $inputs |
             .buildDefinition.resolvedDependencies +=
               [{name: "source", uri: $uri, digest: {gitCommit: $sha}}]' \
            <<< "$PREDICATE" > release/provenance.json

      - name: Attest release binary
        id: attest
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # pin@v3.0.0
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-path: release/hashi-linux-amd64
          predicate-type: ${{ steps.provenance.outputs.predicate-type }}
          predicate-path: release/provenance.json

      - name: Write release notes
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          cat > release/notes.md <<EOF
          Automated Hashi testnet release.

          | Artifact | Identity |
          | --- | --- |
          | Source commit | [\`${SOURCE_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}) |
          | Binary SHA-256 | \`${binary_hash}\` |
          | Docker image | \`${IMAGE}:${RELEASE_TAG}\` |
          | Docker digest | \`${image_digest}\` |
          | Provenance | [GitHub attestation](${ATTESTATION_URL}) |
          | Image build | [sui-operations workflow](${operations_run_url}) |
          | Workflow run | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |

          Verify the downloaded binary:

          \`\`\`sh
          sha256sum --check SHA256SUMS
          gh attestation verify hashi-linux-amd64 --repo ${GITHUB_REPOSITORY}
          \`\`\`

          This release publishes artifacts only. It does not deploy Hashi.
          EOF

      - name: Publish GitHub prerelease
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT
          VERSION=${RELEASE_TAG#testnet-}

          # Reservation is the sole tag creator. Require its annotated tag to
          # still point at the source whose binary was verified above.
          TAG_REF=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")
          if [ "$(jq -r .object.type <<< "$TAG_REF")" != tag ]; then
            echo "Release tag $RELEASE_TAG is not an annotated reservation"
            exit 1
          fi
          TAG_OBJECT=$(gh api "repos/$GH_REPO/git/tags/$(jq -r .object.sha <<< "$TAG_REF")")
          if [ "$(jq -r .object.type <<< "$TAG_OBJECT")" != commit ] ||
             [ "$(jq -r .object.sha <<< "$TAG_OBJECT")" != "$SOURCE_SHA" ]; then
            echo "Release tag $RELEASE_TAG does not point to $SOURCE_SHA"
            exit 1
          fi

          # Listing includes authenticated drafts; the tag endpoint may not.
          # Any API failure aborts instead of being mistaken for absence.
          lookup_release() {
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
              jq --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)] |
                 if length <= 1 then .[0]
                 else error("Duplicate releases for reserved tag") end'
          }
          lookup_release > "$TEMP_DIR/release.json"
          if [ "$(jq -r .id "$TEMP_DIR/release.json")" = null ]; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "Hashi testnet $VERSION" \
              --notes-file release/notes.md
            lookup_release > "$TEMP_DIR/release.json"
          fi

          RELEASE_ID=$(jq -er .id "$TEMP_DIR/release.json")
          gh api --paginate --slurp \
            "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            > "$TEMP_DIR/assets.json"
          for ASSET in hashi-linux-amd64 SHA256SUMS; do
            ASSET_METADATA=$(jq --arg name "$ASSET" \
              '[.[][] | select(.name == $name)] |
               if length <= 1 then .[0]
               else error("Duplicate release asset names") end' \
              "$TEMP_DIR/assets.json")
            ASSET_ID=$(jq -r '.id // empty' <<< "$ASSET_METADATA")
            # GitHub can leave an empty starter after a failed upload. Only
            # unfinished draft placeholders may be removed, never uploaded bytes.
            if [ -n "$ASSET_ID" ] &&
               [ "$(jq -r .draft "$TEMP_DIR/release.json")" = true ] &&
               jq -e '.state == "starter" and .size == 0' <<< "$ASSET_METADATA" >/dev/null; then
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$ASSET_ID"
              ASSET_ID=
            fi
            if [ -n "$ASSET_ID" ]; then
              gh api -H "Accept: application/octet-stream" \
                "repos/$GH_REPO/releases/assets/$ASSET_ID" > "$TEMP_DIR/$ASSET"
              if ! cmp --silent "release/$ASSET" "$TEMP_DIR/$ASSET"; then
                echo "Existing release asset $ASSET differs from the verified bytes; refusing to overwrite"
                exit 1
              fi
            else
              gh release upload "$RELEASE_TAG" "release/$ASSET"
            fi
          done

          if [ "$(jq -r .draft "$TEMP_DIR/release.json")" = true ]; then
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --prerelease \
              --title "Hashi testnet $VERSION" \
              --notes-file release/notes.md
          fi

  deploy:
    name: Reset and deploy devnet
    if: inputs.network == 'devnet'
    needs: resolve
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Dispatch devnet deployment
        env:
          GH_TOKEN: ${{ secrets.DOCKER_BINARY_BUILDS_DISPATCH }}
        run: |
          gh workflow run deploy-hashi-devnet.yaml \
            --repo MystenLabs/sui-operations \
            --ref main \
            -f hashi_commit="$SOURCE_SHA" \
            -f caller_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Wait for devnet deployment
        env:
          GH_TOKEN: ${{ secrets.DOCKER_BINARY_BUILDS_DISPATCH }}
        run: |
          set -euo pipefail
          CALLER_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          EXPECTED_TITLE="Deploy Hashi to devnet (${SOURCE_SHA}) [caller ${CALLER_ID}]"
          RUNS_ENDPOINT="repos/MystenLabs/sui-operations/actions/workflows/deploy-hashi-devnet.yaml/runs"
          OPERATIONS_RUN_ID=

          for attempt in $(seq 1 60); do
            if RUNS=$(gh api --method GET "$RUNS_ENDPOINT" \
              -f event=workflow_dispatch \
              -f per_page=100); then
              OPERATIONS_RUN_ID=$(jq -r --arg title "$EXPECTED_TITLE" \
                '[.workflow_runs[] | select(.display_title == $title)][0].id // empty' <<< "$RUNS")
            else
              echo "Failed to list sui-operations workflow runs; retrying"
            fi
            if [ -n "$OPERATIONS_RUN_ID" ]; then
              break
            fi
            echo "Waiting for the sui-operations workflow run (attempt $attempt/60)"
            sleep 10
          done
          if [ -z "$OPERATIONS_RUN_ID" ]; then
            echo "Timed out finding the dispatched sui-operations workflow run"
            exit 1
          fi
          OPERATIONS_RUN_URL="https://github.com/MystenLabs/sui-operations/actions/runs/${OPERATIONS_RUN_ID}"
          echo "OPERATIONS_RUN_URL=$OPERATIONS_RUN_URL" >> "$GITHUB_ENV"

          for attempt in $(seq 1 900); do
            if ! RUN=$(gh api "repos/MystenLabs/sui-operations/actions/runs/$OPERATIONS_RUN_ID"); then
              echo "Failed to inspect sui-operations run $OPERATIONS_RUN_ID; retrying"
              sleep 20
              continue
            fi
            STATUS=$(jq -r .status <<< "$RUN")
            CONCLUSION=$(jq -r '.conclusion // empty' <<< "$RUN")
            OPERATIONS_RUN_URL=$(jq -r .html_url <<< "$RUN")
            if [ "$STATUS" = completed ]; then
              echo "OPERATIONS_RUN_URL=$OPERATIONS_RUN_URL" >> "$GITHUB_ENV"
              if [ "$CONCLUSION" != success ]; then
                echo "sui-operations deployment concluded with $CONCLUSION: $OPERATIONS_RUN_URL"
                exit 1
              fi
              exit 0
            fi
            echo "Waiting for sui-operations run $OPERATIONS_RUN_ID ($STATUS, attempt $attempt/900)"
            sleep 20
          done
          echo "Timed out waiting for sui-operations run $OPERATIONS_RUN_ID"
          if ! gh run cancel "$OPERATIONS_RUN_ID" --repo MystenLabs/sui-operations; then
            echo "ERROR: Failed to request cancellation for $OPERATIONS_RUN_URL"
            exit 1
          fi
          for attempt in $(seq 1 120); do
            if ! RUN=$(gh api "repos/MystenLabs/sui-operations/actions/runs/$OPERATIONS_RUN_ID"); then
              echo "Failed to inspect cancellation; retrying"
              sleep 10
              continue
            fi
            if [ "$(jq -r .status <<< "$RUN")" = completed ]; then
              echo "Timed-out deployment reached a terminal state."
              exit 1
            fi
            echo "Waiting for cancellation to finish (attempt $attempt/120)"
            sleep 10
          done
          echo "ERROR: Cancellation did not finish for $OPERATIONS_RUN_URL"
          exit 1

      - name: Summarize deployment
        if: always()
        run: |
          {
            echo "## Hashi devnet deployment"
            echo
            echo "Commit: \`$SOURCE_SHA\`"
            if [ -n "${OPERATIONS_RUN_URL:-}" ]; then
              echo "Operations run: $OPERATIONS_RUN_URL"
            else
              echo "Operations run could not be resolved."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
