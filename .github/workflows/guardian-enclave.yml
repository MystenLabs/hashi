name: Guardian Enclave Build

# Measures the guardian EIF for a deployment when dispatched. PRs that change
# Guardian sources, dependencies, or the recipe, and pushes to main that change
# any build-context input, build it with canonical inputs to check reproducibility.
#
# PCR0 is a hash of the built image, and the build takes BUCKET_NAME, AWS_REGION
# and CEREMONY_MODE as inputs — they are substituted into run.sh, which goes in
# the ramdisk the measurement covers. So a PCR0 only means something next to the
# deployment it was built for: pass the same values that stack's enclave hosts
# build with (pulumi/services/hashi-guardian-enclave/Pulumi.<stack>.yaml in
# sui-operations, rendered into user-data by enclave.go), and dispatch this on
# the commit the hosts pin. GIT_REVISION is compiled into the binary, and FEATURES
# selects compile-time behavior; those inputs must match the deployment too.
#
# This is the ONLY sanctioned source for the eif-pcr0 / eif-pcr0-b /
# ceremony-pcr0 config values and for the rotate workflow's hashi_pcr0 input.
# Reading a measurement off the host being verified would make the check
# circular: it would confirm the host runs whatever it runs.
#
# Both runners must agree for the reproducibility check to pass. Keep their
# build caches independent: restoring shared compiled layers would bypass the
# independent builds this check is meant to compare.

on:
  # Build and compare EIFs before merging changes to Guardian or its inputs.
  pull_request:
    paths:
      - docker/hashi-guardian/**
      - crates/hashi-guardian/**
      - crates/hashi-types/**
      - Cargo.toml
      - Cargo.lock
      - .dockerignore
      - .github/workflows/guardian-enclave.yml
  # Hosts build main commits. Keep source paths aligned with out/nitro.eif's
  # prerequisites in docker/hashi-guardian/Makefile.
  push:
    branches: [main]
    paths:
      - docker/hashi-guardian/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .dockerignore
      - .github/workflows/guardian-enclave.yml
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'S3 bucket the guardian logs to (must match the target stack exactly)'
        required: true
        default: 'guardian-test-bucket'
      aws_region:
        description: 'Region of that bucket; must match the target stack. The Makefile defaults to us-east-1.'
        required: true
        default: 'us-west-2'
      ceremony_mode:
        description: 'Enclave boot mode: withdraw (serving) or ceremony (key setup or key-provider rotation, a different PCR0 at the same commit)'
        type: choice
        options:
          - withdraw
          - ceremony
        required: true
        default: withdraw
      features:
        description: 'Extra cargo features. Leave EMPTY for anything whose PCR0 is provenance; non-enclave-dev builds mock attestation.'
        required: false
        default: ''
      git_revision:
        description: 'Commit to build and stamp. Defaults to the dispatched ref. Set it to measure a commit that predates this workflow — an already-deployed guardian, or the ceremony build an allowlist has to keep trusting.'
        required: false
        default: ''

permissions:
  contents: read

# Only a PR's runs cancel each other; every dispatch and main push finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BUCKET_NAME: ${{ inputs.bucket_name || 'guardian-test-bucket' }}
      AWS_REGION: ${{ inputs.aws_region || 'us-west-2' }}
      CEREMONY_MODE_INPUT: ${{ inputs.ceremony_mode || 'withdraw' }}
      FEATURES: ${{ inputs.features || '' }}
    outputs:
      git_revision: ${{ steps.rev.outputs.git_revision }}
      bucket_name: ${{ steps.rev.outputs.bucket_name }}
      aws_region: ${{ steps.rev.outputs.aws_region }}
      ceremony_mode: ${{ steps.rev.outputs.ceremony_mode }}
      features: ${{ steps.rev.outputs.features }}

    steps:
      # The SOURCE measured is git_revision's, not the dispatched ref's — the
      # ref only supplies this workflow file. GIT_REVISION is compiled into the
      # guardian, so stamp the checked-out commit to identify the source used.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_revision || github.sha }}

      - name: Resolve the revision and inputs being measured
        id: rev
        shell: bash
        run: |
          REV="$(git rev-parse HEAD)"
          echo "GIT_REVISION=$REV" >> "$GITHUB_ENV"
          {
            echo "git_revision=$REV"
            echo "bucket_name=$BUCKET_NAME"
            echo "aws_region=$AWS_REGION"
            echo "ceremony_mode=$CEREMONY_MODE_INPUT"
            echo "features=$FEATURES"
          } >> "$GITHUB_OUTPUT"

      - name: Build enclave EIF
        working-directory: docker/hashi-guardian
        env:
          # The Makefile takes "true"/empty, not the friendlier input wording.
          CEREMONY_MODE: ${{ env.CEREMONY_MODE_INPUT == 'ceremony' && 'true' || '' }}
        run: |
          make BUCKET_NAME="$BUCKET_NAME" AWS_REGION="$AWS_REGION" \
               GIT_REVISION="$GIT_REVISION" FEATURES="$FEATURES" \
               CEREMONY_MODE="$CEREMONY_MODE"

      - name: Print PCRs
        working-directory: docker/hashi-guardian
        run: cat out/nitro.pcrs

      # Record the EIF inputs and runner details to diagnose measurement
      # mismatches: the app ramdisk is built here, while the kernel and its
      # config come from a digest-pinned StageX image.
      - name: Provenance of the build inputs
        working-directory: docker/hashi-guardian
        run: |
          echo "runner        : ${{ matrix.os }}"
          echo "nproc         : $(nproc)"
          echo "docker        : $(docker version --format '{{.Server.Version}}')"
          echo "buildx        : $(docker buildx version)"
          sha256sum out/rootfs.cpio out/bzImage out/kernel.config

      - name: Upload build inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: build-inputs-${{ matrix.os }}
          path: |
            docker/hashi-guardian/out/kernel.config
            docker/hashi-guardian/out/bzImage
            docker/hashi-guardian/out/rootfs.cpio

      - name: Upload PCRs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: nitro-pcrs-${{ matrix.os }}
          path: docker/hashi-guardian/out/nitro.pcrs

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download ubuntu-latest PCRs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: nitro-pcrs-ubuntu-latest
          path: pcrs-latest

      - name: Download ubuntu-22.04 PCRs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: nitro-pcrs-ubuntu-22.04
          path: pcrs-22

      - name: Compare PCRs
        id: compare
        run: |
          if diff pcrs-latest/nitro.pcrs pcrs-22/nitro.pcrs > /dev/null; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi
          # Extract individual PCR values
          PCR0=$(awk '/PCR0/ {print $1}' pcrs-latest/nitro.pcrs)
          PCR1=$(awk '/PCR1/ {print $1}' pcrs-latest/nitro.pcrs)
          PCR2=$(awk '/PCR2/ {print $1}' pcrs-latest/nitro.pcrs)
          echo "pcr0=$PCR0" >> "$GITHUB_OUTPUT"
          echo "pcr1=$PCR1" >> "$GITHUB_OUTPUT"
          echo "pcr2=$PCR2" >> "$GITHUB_OUTPUT"

      - name: Print results
        run: |
          {
            echo "## Guardian Enclave PCR Measurements"
            echo ""
            echo "| PCR | Value |"
            echo "|-----|-------|"
            echo "| PCR0 | \`${{ steps.compare.outputs.pcr0 }}\` |"
            echo "| PCR1 | \`${{ steps.compare.outputs.pcr1 }}\` |"
            echo "| PCR2 | \`${{ steps.compare.outputs.pcr2 }}\` |"
            echo ""
            echo "**Cross-runner check**: ${{ steps.compare.outputs.match == 'true' && 'Reproducible' || 'MISMATCH' }} (ubuntu-latest vs ubuntu-22.04; both target linux/amd64)"
            echo ""
            echo "**Trigger**: \`${{ github.event_name }}\`${{ github.event_name != 'workflow_dispatch' && ' — reproducibility check with canonical inputs, NOT a deployment measurement' || '' }}"
            echo ""
            echo "Measured build — a PCR0 is only valid for this exact combination:"
            echo ""
            echo "| Input | Value |"
            echo "|-------|-------|"
            echo "| commit | \`${{ needs.build.outputs.git_revision }}\` |"
            echo "| bucket | \`${{ needs.build.outputs.bucket_name }}\` |"
            echo "| region | \`${{ needs.build.outputs.aws_region }}\` |"
            echo "| mode | \`${{ needs.build.outputs.ceremony_mode }}\` |"
            echo "| features | \`${{ needs.build.outputs.features }}\`${{ needs.build.outputs.features == '' && ' (real attestation)' || ' — custom features, not the canonical production build' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Compare the exported eif_build inputs to narrow down a PCR mismatch.
      # The ramdisk contains Guardian, runtime files, and deployment settings;
      # the current recipe copies the kernel and config from a pinned image.
      - name: Download build inputs (only when the PCRs disagree)
        if: steps.compare.outputs.match != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          pattern: build-inputs-*
          path: inputs

      - name: Fail if PCRs differ
        if: steps.compare.outputs.match != 'true'
        run: |
          echo "PCRs differ across runners!"
          diff pcrs-latest/nitro.pcrs pcrs-22/nitro.pcrs || true
          echo
          echo "Which build input moved:"
          for f in rootfs.cpio bzImage kernel.config; do
            a="$(sha256sum "inputs/build-inputs-ubuntu-latest/$f" 2>/dev/null | cut -d' ' -f1)"
            b="$(sha256sum "inputs/build-inputs-ubuntu-22.04/$f" 2>/dev/null | cut -d' ' -f1)"
            if [ -z "$a" ] || [ -z "$b" ]; then
              printf '  %-14s ?  (artifact missing)\n' "$f"
            elif [ "$a" = "$b" ]; then
              printf '  %-14s same\n' "$f"
            else
              printf '  %-14s DIFFERS\n    ubuntu-latest %s\n    ubuntu-22.04  %s\n' "$f" "$a" "$b"
            fi
          done
          echo
          echo "rootfs.cpio contains Guardian, runtime files, and deployment settings."
          echo "With the published-kernel recipe, bzImage and kernel.config are copied"
          echo "from a pinned image; if they differ, check image/platform selection and export."
          exit 1
