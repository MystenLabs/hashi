name: Guardian Enclave Build

# Builds the guardian EIF on two runner images and fails unless their PCRs
# agree. PCR0 is a hash of the built image, and the build takes BUCKET_NAME,
# AWS_REGION and CEREMONY_MODE as inputs — they are substituted into run.sh,
# which goes in the ramdisk the measurement covers. So a PCR0 only means
# something next to the deployment it was built for.
#
# Three ways in, one pipeline (detect → build → verify):
#
#   workflow_dispatch — a MEASUREMENT. Pass the same values that stack's enclave
#     hosts build with (pulumi/services/hashi-guardian-enclave/Pulumi.<stack>.yaml
#     in sui-operations, rendered into user-data by enclave.go), and dispatch on
#     the commit the hosts pin. This is the ONLY sanctioned source for the
#     eif-pcr0 / eif-pcr0-b / ceremony-pcr0 config values and for the rotate
#     workflow's hashi_pcr0 input. Reading a measurement off the host being
#     verified would make the check circular: it would confirm the host runs
#     whatever it runs.
#
#   pull_request — a REPRODUCIBILITY GATE on the enclave's build inputs, with
#     canonical test values. Its PCR0 is not a deployment measurement; the only
#     question is whether two builders agree. Every enclave host rebuilds the EIF
#     from source, so a change that stops reproducing must not merge — the last
#     one that did was found at a testnet rotation. It runs on EVERY PR: detect
#     says whether an EIF input changed, the build runs only then, and verify
#     always reports — green in seconds otherwise. That is what lets it be a
#     required status check ("EIF reproducibility gate" in branch protection).
#     A trigger-level `paths:` filter would instead leave the check Pending on
#     every other PR and block them.
#
#   push to main — the same gate on the merge result. A PR passes on its own
#     merge ref and main can move under it before it lands (the resolve check
#     runs on push for the same reason), and the commit a stack pins as
#     hashi-commit is a main commit: this leaves it a result on record. Nothing
#     notifies on failure; look the commit's run up before pinning it.
#
# Both runners must agree, or the build is not reproducible and no measurement
# from it can be trusted. No build caching, ever: a cached kernel or cargo
# stage shared by the two runners would have them compare the same bytes, and
# the check would test nothing.

on:
  pull_request:
  push:
    branches: [main]
    # The same list detect greps for below; move them together. Not
    # rust-toolchain.toml: the build never copies it, stagex pins rustc.
    paths:
      - docker/hashi-guardian/**
      - crates/hashi-guardian/**
      - crates/hashi-types/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/guardian-enclave.yml
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'S3 bucket the guardian logs to (must match the target stack exactly)'
        required: true
        default: 'guardian-test-bucket'
      aws_region:
        description: 'Region of that bucket. Every deployed stack is us-west-2; the Makefile default is not.'
        required: true
        default: 'us-west-2'
      ceremony_mode:
        description: 'Enclave boot mode: withdraw (serving) or ceremony (one-time key ceremony, a different PCR0 at the same commit)'
        type: choice
        options:
          - withdraw
          - ceremony
        required: true
        default: withdraw
      features:
        description: 'Extra cargo features. Leave EMPTY for anything whose PCR0 is provenance; non-enclave-dev builds mock attestation.'
        required: false
        default: ''
      git_revision:
        description: 'Commit to build and stamp. Defaults to the dispatched ref. Set it to measure a commit that predates this workflow — an already-deployed guardian, or the ceremony build an allowlist has to keep trusting.'
        required: false
        default: ''

permissions:
  contents: read

# A newer push to the same PR supersedes the build in flight; dispatch and
# main-push runs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Always runs. On a PR it diffs GitHub's merge of the PR against the base it
  # would land on; a push or dispatch always builds. The list is what the
  # Containerfile copies in (root manifest, root lock, the two crates) plus the
  # Containerfile's own directory and this file — the same set the Makefile's
  # out/nitro.eif prerequisites name. A miss here fails silently: the gate
  # stays green on a change it never built.
  detect:
    name: Detect EIF input changes
    runs-on: ubuntu-latest
    outputs:
      eif: ${{ github.event_name != 'pull_request' || steps.diff.outputs.eif == 'true' }}
    steps:
      # HEAD is GitHub's merge of the PR into its base, HEAD^1 that base.
      - name: Checkout the merge commit and its parents
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7
        with:
          fetch-depth: 2

      - name: Diff the PR against its base
        if: github.event_name == 'pull_request'
        id: diff
        run: |
          git diff --name-only HEAD^1 HEAD > changed
          if grep -E '^(docker/hashi-guardian/|crates/hashi-guardian/|crates/hashi-types/|Cargo\.(toml|lock)$|\.github/workflows/guardian-enclave\.yml$)' changed; then
            echo "eif=true" >> "$GITHUB_OUTPUT"
          else
            echo "none of the $(wc -l < changed) changed files is an EIF input"
            echo "eif=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [detect]
    if: needs.detect.outputs.eif == 'true'
    strategy:
      # A leg that fails alone leaves the other's PCRs for triage, and
      # "re-run failed jobs" then rebuilds only the one that broke.
      fail-fast: false
      matrix:
        # Two kernels and two Docker releases. Pinned rather than ubuntu-latest:
        # when -latest moves to 26.04 the pair would silently become one image.
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Dispatch inputs are empty on pull_request and push; these are the gate's
    # canonical values (the bucket is the Makefile's default, the region every
    # deployed stack's).
    env:
      BUCKET_NAME: ${{ inputs.bucket_name || 'guardian-test-bucket' }}
      AWS_REGION: ${{ inputs.aws_region || 'us-west-2' }}
      CEREMONY_MODE_INPUT: ${{ inputs.ceremony_mode || 'withdraw' }}
      FEATURES: ${{ inputs.features || '' }}
    outputs:
      git_revision: ${{ steps.rev.outputs.git_revision }}
      bucket_name: ${{ steps.rev.outputs.bucket_name }}
      aws_region: ${{ steps.rev.outputs.aws_region }}
      ceremony_mode: ${{ steps.rev.outputs.ceremony_mode }}
      features: ${{ steps.rev.outputs.features }}

    steps:
      # The SOURCE measured is git_revision's, not the dispatched ref's — the
      # ref only supplies this workflow file. GIT_REVISION is compiled into the
      # guardian, so the two must name the same commit or the EIF measures a
      # build that never existed.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7
        with:
          ref: ${{ inputs.git_revision || github.sha }}

      - name: Resolve the revision and inputs being measured
        id: rev
        shell: bash
        run: |
          REV="$(git rev-parse HEAD)"
          echo "GIT_REVISION=$REV" >> "$GITHUB_ENV"
          {
            echo "git_revision=$REV"
            echo "bucket_name=$BUCKET_NAME"
            echo "aws_region=$AWS_REGION"
            echo "ceremony_mode=$CEREMONY_MODE_INPUT"
            echo "features=$FEATURES"
          } >> "$GITHUB_OUTPUT"

      - name: Build enclave EIF
        working-directory: docker/hashi-guardian
        env:
          # The Makefile takes "true"/empty, not the friendlier input wording.
          CEREMONY_MODE: ${{ env.CEREMONY_MODE_INPUT == 'ceremony' && 'true' || '' }}
        run: |
          make BUCKET_NAME="$BUCKET_NAME" AWS_REGION="$AWS_REGION" \
               GIT_REVISION="$GIT_REVISION" FEATURES="$FEATURES" \
               CEREMONY_MODE="$CEREMONY_MODE"

      - name: Print PCRs
        working-directory: docker/hashi-guardian
        run: cat out/nitro.pcrs

      # PCR0 covers everything, so a mismatch between runners says only "the
      # build moved". These say which half: rootfs.cpio is the app ramdisk
      # (PCR2), bzImage the kernel (PCR1). Plus the host facts a from-source
      # kernel build can leak — core count reaches it through `make -j$(nproc)`.
      - name: Provenance of the build inputs
        working-directory: docker/hashi-guardian
        run: |
          echo "runner        : ${{ matrix.os }}"
          echo "nproc         : $(nproc)"
          echo "docker        : $(docker version --format '{{.Server.Version}}')"
          echo "buildx        : $(docker buildx version)"
          echo "buildkit      : $(docker buildx inspect | awk '/^BuildKit version:/ {print $3}')"
          sha256sum out/rootfs.cpio out/bzImage out/kernel.config

      - name: Upload build-input hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: build-inputs-${{ matrix.os }}
          path: |
            docker/hashi-guardian/out/kernel.config
            docker/hashi-guardian/out/bzImage
            docker/hashi-guardian/out/rootfs.cpio

      - name: Upload PCRs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: nitro-pcrs-${{ matrix.os }}
          path: docker/hashi-guardian/out/nitro.pcrs

  # THE STATUS CHECK. Reports on every run that was not cancelled: green when
  # no EIF input changed, otherwise only when both builds succeeded and their
  # PCRs agree. Fails closed when detect did not succeed — its output is then
  # unset, which would otherwise read as "nothing changed". Require this job,
  # never build: a job skipped because its dependency failed reports Success,
  # so a required build would not block a broken one.
  verify:
    name: EIF reproducibility gate
    needs: [detect, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      DETECT_RESULT: ${{ needs.detect.result }}
      EIF_CHANGED: ${{ needs.detect.outputs.eif }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Check the upstream jobs
        run: |
          if [ "$DETECT_RESULT" != success ]; then
            echo "detect did not succeed ($DETECT_RESULT): cannot tell whether an EIF input changed, failing closed"
            exit 1
          fi
          if [ "$EIF_CHANGED" != true ]; then
            echo "No EIF input changed; nothing to build." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$BUILD_RESULT" != success ]; then
            echo "An EIF input changed and the build did not succeed ($BUILD_RESULT)"
            exit 1
          fi

      - name: Download PCRs
        if: env.EIF_CHANGED == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          pattern: nitro-pcrs-*
          path: pcrs

      # One nitro.pcrs per runner, at pcrs/nitro-pcrs-<runner>/nitro.pcrs.
      - name: Compare PCRs
        if: env.EIF_CHANGED == 'true'
        id: compare
        run: |
          files=(pcrs/*/nitro.pcrs)
          sha256sum "${files[@]}"
          distinct=$(sha256sum "${files[@]}" | cut -d' ' -f1 | sort -u | wc -l)
          if [ "${#files[@]}" -ge 2 ] && [ "$distinct" -eq 1 ]; then match=true; else match=false; fi
          {
            echo "match=$match"
            echo "runners=$(printf '%s\n' "${files[@]}" | sed 's#^pcrs/nitro-pcrs-##; s#/nitro.pcrs$##' | paste -sd, -)"
            echo "pcr0=$(awk '$2 == "PCR0" {print $1}' "${files[0]}")"
            echo "pcr1=$(awk '$2 == "PCR1" {print $1}' "${files[0]}")"
            echo "pcr2=$(awk '$2 == "PCR2" {print $1}' "${files[0]}")"
          } >> "$GITHUB_OUTPUT"

      - name: Print results
        if: env.EIF_CHANGED == 'true'
        run: |
          {
            echo "## Guardian Enclave PCR Measurements"
            echo ""
            echo "| PCR | Value |"
            echo "|-----|-------|"
            echo "| PCR0 | \`${{ steps.compare.outputs.pcr0 }}\` |"
            echo "| PCR1 | \`${{ steps.compare.outputs.pcr1 }}\` |"
            echo "| PCR2 | \`${{ steps.compare.outputs.pcr2 }}\` |"
            echo ""
            echo "**Cross-platform check**: ${{ steps.compare.outputs.match == 'true' && 'Reproducible' || 'MISMATCH' }} (${{ steps.compare.outputs.runners }})"
            echo ""
            echo "**Trigger**: \`${{ github.event_name }}\`${{ github.event_name != 'workflow_dispatch' && ' — reproducibility gate with canonical inputs, NOT a deployment measurement' || '' }}"
            echo ""
            echo "Measured build — a PCR0 is only valid for this exact combination:"
            echo ""
            echo "| Input | Value |"
            echo "|-------|-------|"
            echo "| commit | \`${{ needs.build.outputs.git_revision }}\` |"
            echo "| bucket | \`${{ needs.build.outputs.bucket_name }}\` |"
            echo "| region | \`${{ needs.build.outputs.aws_region }}\` |"
            echo "| mode | \`${{ needs.build.outputs.ceremony_mode }}\` |"
            echo "| features | \`${{ needs.build.outputs.features }}\`${{ needs.build.outputs.features == '' && ' (real attestation)' || ' — MOCK attestation, not provenance' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # A bare "the PCRs differ" costs whoever sees it a long investigation:
      # PCR0 covers everything, so it only says the build moved. These are the
      # inputs eif_build consumed, and naming the one that moved is most of the
      # diagnosis. The last time this fired, the answer was the kernel — it was
      # stamping its built-in initramfs with the wall clock.
      - name: Download build inputs (only when the PCRs disagree)
        if: env.EIF_CHANGED == 'true' && steps.compare.outputs.match != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          pattern: build-inputs-*
          path: inputs

      - name: Fail if PCRs differ
        if: env.EIF_CHANGED == 'true' && steps.compare.outputs.match != 'true'
        run: |
          echo "PCRs differ across runners (${{ steps.compare.outputs.runners }})!"
          for f in pcrs/*/nitro.pcrs; do
            echo "== $f"
            cat "$f"
          done
          echo
          echo "Which build input moved (rootfs.cpio is the app ramdisk = PCR2, bzImage the kernel = PCR1):"
          sha256sum inputs/*/rootfs.cpio inputs/*/bzImage inputs/*/kernel.config || true
          for f in rootfs.cpio bzImage kernel.config; do
            copies=$(sha256sum inputs/*/"$f" 2>/dev/null | wc -l | tr -d ' ')
            distinct=$(sha256sum inputs/*/"$f" 2>/dev/null | cut -d' ' -f1 | sort -u | wc -l)
            if [ "$copies" -lt 2 ]; then
              echo "  $f: only $copies copy present"
            elif [ "$distinct" -eq 1 ]; then
              echo "  $f: same"
            else
              echo "  $f: DIFFERS"
            fi
          done
          echo
          echo "If only bzImage moved, suspect something the kernel build absorbs from its"
          echo "environment — a clock reaching the built-in initramfs is the failure mode"
          echo "that has happened before."
          exit 1
