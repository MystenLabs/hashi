name: Deploy Hashi Devnet
run-name: Deploy Hashi devnet (${{ github.sha }})

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: Reset and deploy devnet
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Dispatch devnet deployment
        env:
          GH_TOKEN: ${{ secrets.DOCKER_BINARY_BUILDS_DISPATCH }}
        run: |
          gh workflow run deploy-hashi-devnet.yaml \
            --repo MystenLabs/sui-operations \
            --ref main \
            -f hashi_commit="$GITHUB_SHA" \
            -f caller_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Wait for devnet deployment
        env:
          GH_TOKEN: ${{ secrets.DOCKER_BINARY_BUILDS_DISPATCH }}
        run: |
          set -euo pipefail
          CALLER_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          EXPECTED_TITLE="Deploy Hashi to devnet (${GITHUB_SHA}) [caller ${CALLER_ID}]"
          RUNS_ENDPOINT="repos/MystenLabs/sui-operations/actions/workflows/deploy-hashi-devnet.yaml/runs"
          OPERATIONS_RUN_ID=

          for attempt in $(seq 1 60); do
            if RUNS=$(gh api --method GET "$RUNS_ENDPOINT" \
              -f event=workflow_dispatch \
              -f per_page=100); then
              OPERATIONS_RUN_ID=$(jq -r --arg title "$EXPECTED_TITLE" \
                '[.workflow_runs[] | select(.display_title == $title)][0].id // empty' <<< "$RUNS")
            else
              echo "Failed to list sui-operations workflow runs; retrying"
            fi
            if [ -n "$OPERATIONS_RUN_ID" ]; then
              break
            fi
            echo "Waiting for the sui-operations workflow run (attempt $attempt/60)"
            sleep 10
          done
          if [ -z "$OPERATIONS_RUN_ID" ]; then
            echo "Timed out finding the dispatched sui-operations workflow run"
            exit 1
          fi
          OPERATIONS_RUN_URL="https://github.com/MystenLabs/sui-operations/actions/runs/${OPERATIONS_RUN_ID}"
          echo "OPERATIONS_RUN_URL=$OPERATIONS_RUN_URL" >> "$GITHUB_ENV"

          for attempt in $(seq 1 900); do
            if ! RUN=$(gh api "repos/MystenLabs/sui-operations/actions/runs/$OPERATIONS_RUN_ID"); then
              echo "Failed to inspect sui-operations run $OPERATIONS_RUN_ID; retrying"
              sleep 20
              continue
            fi
            STATUS=$(jq -r .status <<< "$RUN")
            CONCLUSION=$(jq -r '.conclusion // empty' <<< "$RUN")
            OPERATIONS_RUN_URL=$(jq -r .html_url <<< "$RUN")
            if [ "$STATUS" = completed ]; then
              echo "OPERATIONS_RUN_URL=$OPERATIONS_RUN_URL" >> "$GITHUB_ENV"
              if [ "$CONCLUSION" != success ]; then
                echo "sui-operations deployment concluded with $CONCLUSION: $OPERATIONS_RUN_URL"
                exit 1
              fi
              exit 0
            fi
            echo "Waiting for sui-operations run $OPERATIONS_RUN_ID ($STATUS, attempt $attempt/900)"
            sleep 20
          done
          echo "Timed out waiting for sui-operations run $OPERATIONS_RUN_ID"
          if ! gh run cancel "$OPERATIONS_RUN_ID" --repo MystenLabs/sui-operations; then
            echo "ERROR: Failed to request cancellation for $OPERATIONS_RUN_URL"
            exit 1
          fi
          for attempt in $(seq 1 120); do
            if ! RUN=$(gh api "repos/MystenLabs/sui-operations/actions/runs/$OPERATIONS_RUN_ID"); then
              echo "Failed to inspect cancellation; retrying"
              sleep 10
              continue
            fi
            if [ "$(jq -r .status <<< "$RUN")" = completed ]; then
              echo "Timed-out deployment reached a terminal state."
              exit 1
            fi
            echo "Waiting for cancellation to finish (attempt $attempt/120)"
            sleep 10
          done
          echo "ERROR: Cancellation did not finish for $OPERATIONS_RUN_URL"
          exit 1

      - name: Summarize deployment
        if: always()
        run: |
          {
            echo "## Hashi devnet deployment"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            if [ -n "${OPERATIONS_RUN_URL:-}" ]; then
              echo "Operations run: $OPERATIONS_RUN_URL"
            else
              echo "Operations run could not be resolved."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
